    /usr/share/makedumpfile/
    %endif
    %ifarch %{ix86} x86_64 aarch64
    %{_sysconfdir}/makedumpfile.conf.sample
    %endif
    %ifarch %{ix86} x86_64 aarch64
    /usr/sbin/makedumpfile
    %endif
    
    
