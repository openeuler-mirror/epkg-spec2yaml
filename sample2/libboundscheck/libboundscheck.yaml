name: libboundscheck
meta.summary: Enhanced safety functions
version: v1.1.11
release: 6
meta.license: Mulan PSL v2
meta.homepage: https://gitee.com/openeuler/libboundscheck
sources:
    - https://gitee.com/openeuler/libboundscheck/repository/archive/%{name}-%{version}.tar.gz
meta.description: |
    libboundscheck provides a set of functions of
    the common memory/string operation classes.
requires:
    - "glibc"
buildRequires:
    - "gcc make rpm-build"
files: |
    %defattr(-,root,root)
    %{_libdir}/libboundscheck.so
    %{_includedir}/securec.h
    %{_includedir}/securectype.h
    %doc README.md
    %license LICENSE
    
rpmMacros:
    - "%define debug_package %{nil}"

