name: less
meta.summary: Less is a pager that displays text files.
version: 590
release: 2
meta.license: GPLv3+ or BSD
meta.homepage: "http://www.greenwoodsoftware.com/less"
source:
    "0": http://www.greenwoodsoftware.com/less/%{name}-%{version}.tar.gz
patchset:
    "0": less-394-time.patch
    "1": less-475-fsync.patch
meta.description: |
    Less is a pager. A pager is a program that displays text files.
    Other pagers commonly in use are more and pg. Pagers are often
    used in command-line environments like the Unix shell and the MS-DOS
    command prompt to display files.
    
    Less is not an editor. You can't change the contents of the file
    you're viewing. Less is not a windowing system. It doesn't have
    fancy scroll bars or other GUI (graphical user interface) elements.
buildRequires:
    - "gcc make ncurses-devel autoconf automake libtool"
subpackage:
    less-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
