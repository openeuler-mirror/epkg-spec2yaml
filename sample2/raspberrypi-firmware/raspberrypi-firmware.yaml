name: raspberrypi-firmware
meta.summary: Firmware files used for RaspberryPi
version: 20220316
release: 6
meta.license: GPL+ and GPLv2+ and MIT and Redistributable, no modification permitted
meta.homepage: "https://github.com/raspberrypi/firmware"
source:
    "0": "https://github.com/raspberrypi/firmware/archive/%{firmware_release}/firmware-%{firmware_release}.tar.gz"
    "1": "%{name}-%{version}.tar.gz"
meta.description: This package contains firmware images required by some RaspberryPi devices.
provides:
    - "raspberrypi-firmware = %{version}-%{release}"
conflicts:
    - "linux-firmware"
exclusiveArch:
    - "aarch64"
rpmMacros:
    - "%global _lib_path /usr/lib/firmware"
    - "%global _license_path /usr/share/licenses/raspi"
    - "%global firmware_release 1.20220308"
    - "%global debug_package %{nil}"

