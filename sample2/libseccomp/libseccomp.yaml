name: libseccomp
meta.summary: Interface to the syscall filtering mechanism
version: 2.5.3
release: 2
meta.license: LGPLv2
meta.homepage: https://github.com/seccomp/libseccomp
sources:
    - https://github.com/seccomp/libseccomp/releases/download/v%{version}/%{name}-%{version}.tar.gz
patchset:
    - backport-bpf-pfc-Add-handling-for-0-syscalls-in-the-binary-tr.patch
    - backport-tests-Add-a-binary-tree-test-with-zero-syscalls.patch
meta.description: |
    The libseccomp library provides an easy to use, platform independent, interface to
    the Linux Kernel's syscall filtering mechanism. The libseccomp API is designed to
    abstract away the underlying BPF based syscall filter language and present a more
    conventional function-call based filtering interface that should be familiar to,
    and easily adopted by, application developers.
buildRequires:
    - "gcc gperf autoconf automake"
files: |
    %doc CREDITS
    %license LICENSE
    %{_libdir}/%{name}.so.*
    
subpackage:
    - name: devel
      meta.summary: Development files for %{name}
      meta.description: |
          The %{name}-devel package contains libraries and header files for
          developing applications that use %{name}.
      requires:
          - "%{name} = %{version}-%{release}"
      provides:
          - "%{name}-static = %{version}-%{release}"
      obsoletes:
          - "%{name}-static <= %{version}-%{release}"
      files: |
          %{_bindir}/scmp_sys_resolver
          %{_includedir}/seccomp.h
          %{_includedir}/seccomp-syscalls.h
          %{_libdir}/%{name}.a
          %{_libdir}/%{name}.so
          %{_libdir}/pkgconfig/%{name}.pc
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %doc CHANGELOG CONTRIBUTING.md README.md
          %{_mandir}/man*/*
          

