name: ethtool
meta.summary: Settings tool for Ethernet NICs
version: 5.19
release: 1
epoch: 2
meta.license: GPLv2
meta.homepage: https://www.kernel.org/pub/software/network/ethtool
sources:
    - https://www.kernel.org/pub/software/network/%{name}/%{name}-%{version}.tar.xz
meta.description: |
    Ethtool is the standard Linux utility for controlling network drivers and
    hardware, particularly for wired Ethernet devices. It can be used to:
    
    - Get identification and diagnostic information
    - Get extended device statistics
    - Control speed, duplex, autonegotiation and flow control for Ethernet devices
    - Control checksum offload and other hardware offload features
    - Control DMA ring sizes and interrupt moderation
    - Control receive queue selection for multiqueue devices
    - Upgrade firmware in flash memory
buildRequires:
    - "gcc"
    - "libmnl-devel"
conflicts:
    - "filesystem < 3"
files: |
    %defattr(-,root,root)
    %doc AUTHORS
    %license COPYING LICENSE
    %{_sbindir}/%{name}
    %dir %{_datadir}/bash-completion/
    %dir %{_datadir}/bash-completion/completions/
    %{_datadir}/bash-completion/completions/ethtool
    
subpackage:
    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %doc ChangeLog* NEWS README
          %{_mandir}/man8/%{name}.8*
          

