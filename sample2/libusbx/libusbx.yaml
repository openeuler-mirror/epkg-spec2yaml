name: libusbx
meta.summary: Library for accessing USB devices
version: 1.0.24
release: 2
meta.license: LGPLv2+
meta.homepage: http://libusb.info
sources:
    - https://github.com/libusb/libusb/releases/download/v1.0.24/libusb-1.0.24.tar.bz2
meta.description: |
    libusb is a library for USB device access from Linux, macOS, Windows, OpenBSD/NetBSD and Haiku userspace. It is written in C (Haiku backend in C++) and licensed under the GNU Lesser General Public License version 2.1 or, at your option, any later version (see COPYING).
    
    libusb is abstracted internally in such a way that it can hopefully be ported to other operating systems. Please see the PORTING file for more information.
buildRequires:
    - "systemd-devel doxygen libtool"
files: |
    %doc AUTHORS README ChangeLog
    %license COPYING
    %{_libdir}/*.so.*
    %exclude %{_libdir}/*.la
    
rpmMacros:
    - "%global source  libusb"

subpackage:
    - name: devel
      meta.summary: %{name} libs and docs files for development
      meta.description: The %{name}-devel package contains libraries and header files.
      requires:
          - "%{name}%{?_isa} = %{version}-%{release}"
      provides:
          - "libusb1-devel = %{version}-%{release}"
          - "libusb1-devel-doc = %{version}-%{release}"
          - "libusbx-devel-doc"
      obsoletes:
          - "libusb1-devel <= 1.0.9"
          - "libusb1-devel-doc <= 1.0.22-1"
          - "libusbx-devel-doc"
      files: |
          %doc examples/*.c
          %{_includedir}/libusb-1.0
          %{_libdir}/*.so
          %{_libdir}/pkgconfig/libusb-1.0.pc
          

