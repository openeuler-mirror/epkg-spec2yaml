name: libsepol
meta.summary: SELinux binary policy manipulation library
version: 3.3
release: 2
meta.license: LGPLv2+
meta.homepage: https://github.com/SELinuxProject/selinux/wiki/Releases
sources:
    - https://github.com/SELinuxProject/selinux/releases/download/%{version}/%{name}-%{version}.tar.gz
meta.description: |
    libsepol provides an API for the manipulation of SELinux binary
    policies. It is used by checkpolicy (the policy compiler) and similar
    tools, as well as by programs like load_policy that need to perform
    specific transformations on binary policies such as customizing
    policy boolean settings.
buildRequires:
    - "gcc flex"
files: |
    %defattr(-,root,root)
    %license COPYING
    %{_libdir}/libsepol.so.*
    
subpackage:
    - name: devel
      meta.summary: Header files and libraries for %{name}
      meta.description: Header files and libraries for %{name}
      requires:
          - "%{name} = %{version}-%{release}"
      provides:
          - "%{name}-static = %{version}-%{release}"
      files: |
          %defattr(-,root,root)
          %{_includedir}/*
          %{_libdir}/*.so
          %{_libdir}/pkgconfig/libsepol.pc
          %{_libdir}/*.a
          %exclude %{_bindir}/chkcon
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %{_mandir}/man8/*
          %{_mandir}/ru/man8/*
          %{_mandir}/man3/*
          

