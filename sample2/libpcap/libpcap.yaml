name: libpcap
meta.summary: A system-independent interface for user-level packet capture
version: 1.10.1
release: 2
epoch: 14
meta.license: BSD
meta.homepage: http://www.tcpdump.org
sources:
    - http://www.tcpdump.org/release/%{name}-%{version}.tar.gz
patchset:
    - 0003-pcap-linux-apparently-ctc-interfaces-on-s390-has-eth.patch
    - pcap-config-mitigate-multilib-conflict.patch
meta.description: |
    This is the official web site of tcpdump, a powerful command-line
    packet analyzer; and libpcap, a portable C/C++ library for
    network traffic capture.
buildRequires:
    - "bison flex gcc glibc-kernheaders >= 2.2.0"
    - "bluez-libs-devel %ifnarch i686"
files: |
    %defattr(-,root,root)
    %license LICENSE
    %{_libdir}/libpcap.so.*
    
subpackage:
    - name: devel
      meta.summary: header files for libpcap
      meta.description: header files for libpcap
      requires:
          - "%{name} = %{epoch}:%{version}-%{release}"
      files: |
          %defattr(-,root,root)
          %{_bindir}/pcap-config
          %{_includedir}/*
          %{_libdir}/libpcap.so
          %{_libdir}/pkgconfig/libpcap.pc
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %doc README.md CHANGES CREDITS
          %{_mandir}/man*
          

