meta.description: |
    The GNU Binutils are a collection of binary tools. The main ones are:
    ld - the GNU linker.
    as - the GNU assembler.
    addr2line - Converts addresses into filenames and line numbers.
    ar - A utility for creating, modifying and extracting from archives.
    c++filt - Filter to demangle encoded C++ symbols.
    dlltool - Creates files for building and using DLLs.
    gold - A new, faster, ELF only linker, still in beta test.
    gprof - Displays profiling information.
    nlmconv - Converts object code into an NLM.
    nm - Lists symbols from object files.
    objcopy - Copies and translates object files.
    objdump - Displays information from object files.
    ranlib - Generates an index to the contents of an archive.
    readelf - Displays information from any ELF format object file.
    size - Lists the section sizes of an object or archive file.
    strings - Lists printable strings from files.
    trip - Discards symbols.
    windmc - A Windows compatible message compiler.
    windres - A compiler for Windows resource files.
requiresPreUn:
    - "info chkconfig"
requiresPost:
    - "info coreutils chkconfig"
buildRequires:
    - "gcc, perl, sed, coreutils, dejagnu, zlib-devel, glibc-static, sharutils, bc, libstdc++-static"
    - "bison, m4, gcc-c++, gettext, flex, zlib-devel, texinfo >= 4.0, perl-podlators chrpath"
provides:
    - "bundled(libiberty)"
buildRoot:
    - "%(mktemp -ud %{_tmppath}/%{name}-%{version}-%{release}-XXXXXX)"
rpmMacros:
    - "%bcond_without gold %ifnarch riscv64"
    - "%bcond_with gold %else %ifnarch riscv64"
    - "%define _gnu %{nil}"
    - "%{!?ld_bfd_priority: %global ld_bfd_priority    50}"
    - "%{!?ld_gold_priority:%global ld_gold_priority   30} %if %{with gold}"

subpackage:
    binutils-devel:
        meta.summary: devel package including header files and libraries.
        meta.description: The devel package contains BFD and opcodes static and dynamic libraries.
The static libraries are used by the dynamic libraries which are linkier
scripts imported from glibc/Makerules.
        requires:
            - "zlib-devel, binutils = %{version}-%{release}, coreutils"
        requiresPreUn:
            - "info"
        requiresPost:
            - "info"
        provides:
            - "binutils-static = %{version}-%{release}"
    binutils-help:
        meta.summary: binutils help
        meta.description: The help package contains man files.
        filesInput: binutils.lang

