name: logrotate
meta.summary: simplify the administration of log files
version: 3.20.1
release: 1
meta.license: GPLv2+
meta.homepage: "https://github.com/logrotate/logrotate"
source:
    "0": https://github.com/logrotate/logrotate/releases/download/%{version}/logrotate-%{version}.tar.xz
patchset:
    "0": 0001-logrotate-3.20.1-lock-state-msg.patch
meta.description: |
    The logrotate utility is designed to simplify the administration of
    log files on a system which generates a lot of log files.  Logrotate
    allows for the automatic rotation compression, removal and mailing of
    log files.logrotate  Logrotate can be set to handle a log file daily, weekly,
    monthly or when the log file gets to a certain size.
requires:
    - "coreutils"
buildRequires:
    - "acl gcc automake libacl-devel libselinux-devel popt-devel"
rpmMacros:
    - "%global _configure ../configure"

subpackage:
    logrotate-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
