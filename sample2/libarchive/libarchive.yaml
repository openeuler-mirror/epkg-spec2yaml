name: libarchive
meta.summary: Multi-format archive and compression library
version: 3.6.1
release: 1
meta.license: BSD
meta.homepage: "https://www.libarchive.org/"
source:
    "0": https://libarchive.org/downloads/%{name}-%{version}.tar.gz
patchset:
    "0": 0001-Drop-rmd160-from-OpenSSL.patch
    "1": libarchive-uninitialized-value.patch
meta.description: |
    %{name} is an open-source BSD-licensed C programming library that
    provides streaming access to a variety of different archive formats,
    including tar, cpio, pax, zip, and ISO9660 images. The distribution
    also includes bsdtar and bsdcpio, full-featured implementations of
    tar and cpio that use %{name}.
buildRequires:
    - "gcc bison sharutils zlib-devel bzip2-devel xz-devel"
    - "lzo-devel e2fsprogs-devel libacl-devel libattr-devel"
    - "openssl-devel libxml2-devel lz4-devel automake libzstd-devel"
    - "autoconf libtool make"
rpmMacros:
    - "%bcond_without check"

subpackage:
    libarchive-devel:
        meta.summary: Development files for %{name}
        meta.description: %{name}-devel contains the header files for developing
applications that want to make use of %{name}.
        requires:
            - "%{name} = %{version}-%{release}"
    libarchive-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
    bsdtar:
        meta.summary: Manipulate tape archives
        meta.description: The bsdtar package contains standalone bsdtar utility split off regular
libarchive packages.
        requires:
            - "%{name}%{?_isa} = %{version}-%{release}"
    bsdcpio:
        meta.summary: Copy files to and from archives
        meta.description: The bsdcpio package contains standalone bsdcpio utility split off regular
libarchive packages.
        requires:
            - "%{name}%{?_isa} = %{version}-%{release}"
    bsdcat:
        meta.summary: Expand files to standard output
        meta.description: The bsdcat program typically takes a filename as an argument or reads standard
input when used in a pipe.  In both cases decompressed data it written to
standard output.
        requires:
            - "%{name}%{?_isa} = %{version}-%{release}"
