name: expat
meta.summary: An XML parser library
version: 2.4.8
release: 3
meta.license: MIT
meta.homepage: https://libexpat.github.io/
sources:
    - https://github.com/libexpat/libexpat/releases/download/%{Rversion}/expat-%{version}.tar.gz
patchset:
    - backport-0001-CVE-2022-40674.patch
    - backport-0002-CVE-2022-40674.patch
meta.description: |
    expat is a stream-oriented XML parser library written in C.
    expat excels with files too large to fit RAM, and where
    performance and flexibility are crucial.
buildRequires:
    - "sed,autoconf,automake,gcc-c++,libtool,xmlto"
files: |
    %defattr(-,root,root)
    %license COPYING AUTHORS
    %{_bindir}/*
    %{_libdir}/libexpat.so.1*
    %exclude %{_docdir}/%{name}/AUTHORS
    
rpmMacros:
    - "%define Rversion %(echo %{version} | sed -e 's/\\\\./_/g' -e 's/^/R_/')"

subpackage:
    - name: devel
      meta.summary: Development files
      meta.description: This package provides with static libraries and  header files for developing with expat.
      requires:
          - "%{name} = %{version}-%{release}"
      files: |
          %defattr(-,root,root)
          %{_includedir}/*
          %{_libdir}/{libexpat.*a,libexpat.so}
          %{_libdir}/cmake/expat-%{version}
          %{_libdir}/pkgconfig/expat.pc
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %doc README.md
          %{_mandir}/man1/*
          

