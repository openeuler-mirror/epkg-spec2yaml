name: tzdata
meta.summary: Timezone data
version: 2022a
release: 6
meta.license: Public Domain
meta.homepage: https://www.iana.org/time-zones
sources:
    - https://data.iana.org/time-zones/releases/tzdata%{version}.tar.gz
    - https://data.iana.org/time-zones/releases/tzcode%{version}.tar.gz
    - javazic.tar.gz
    - javazic-1.8-37392f2f5d59.tar.xz
patchset:
    - backport-Iran-will-stop-DST-in-2023.patch
    - backport-Chile-s-DST-is-delayed-by-a-week-in-September-2022.patch
    - backport-Palestine-transitions-are-now-Saturdays-at-02-00.patch
    - backport-Tweak-expression-of-Palestine-transition.patch
    - bugfix-0001-add-Beijing-timezone.patch
    - remove-country-selection-from-tzselect-steps.patch
    - remove-ROC-timezone.patch
    - rename-Macau-to-Macao.patch
    - remove-El_Aaiun-timezone.patch
    - remove-Israel-timezone.patch
    - skip-check_web-testcase.patch
meta.description: |
    This package contains data files with rules for various timezones around
    the world.
buildRequires:
    - "gawk glibc perl-interpreter"
    - "java-devel"
    - "glibc-common >= 2.5.90-7"
files: |
    %{_datadir}/zoneinfo
    %doc README
    %doc theory.html
    %doc tz-link.html
    %doc tz-art.html
    %license LICENSE
    
Buildarchitectures:
    - noarch
subpackage:
    - name: java
      meta.summary: Timezone data for Java
      meta.description: This package contains timezone information for use by Java runtimes.
      files: |
          %{_datadir}/javazi
          %{_datadir}/javazi-1.8
          

