name: acl
meta.summary: Commands for manipulating POSIX access control lists
version: 2.3.1
release: 1
meta.license: GPLv2+
meta.homepage: "https://savannah.nongnu.org/projects/acl"
source:
    "0": http://download.savannah.nongnu.org/releases/acl/%{name}-%{version}.tar.gz
    "1": http://download.savannah.nongnu.org/releases/acl/%{name}-%{version}.tar.gz.sig
    "2": agruen-key.gpg
meta.description: |
    This package contains commands for manipulating POSIX access control lists,
    and the libacl.so dynamic library which contains the POSIX 1003.1e draft
    standard 17 functions for manipulating access control lists.
buildRequires:
    - "libattr-devel gawk libtool gettext"
subpackage:
    libacl:
        meta.summary: Library for supporting access control list
        meta.license: LGPLv2+
        meta.description: This package contains the library for manipulating access control list.
        conflicts:
            - "filesystem < 3"
        filesInput: "%{name}.lang"
    libacl-devel:
        meta.summary: Files necessary to develop applications with libacl
        meta.license: LGPLv2+
        meta.description: This package contains header files for the POSIX ACL library.
        requires:
            - "libacl = %{version}-%{release}, libattr-devel"
        obsoletes:
            - "acl-devel < %{version}-%{release}"
    acl-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
