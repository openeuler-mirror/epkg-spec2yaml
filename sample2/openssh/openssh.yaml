name: openssh
meta.summary: An open source implementation of SSH protocol version 2
version: 8.8p1
release: "%{openssh_release}"
meta.license: BSD
meta.homepage: "http://www.openssh.com/portable.html"
source:
    "0": https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz
    "1": https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz.asc
    "2": sshd.pam
    "3": http://prdownloads.sourceforge.net/pamsshagentauth/pam_ssh_agent_auth/pam_ssh_agent_auth-0.10.4.tar.gz
    "4": pam_ssh_agent-rmheaders
    "5": ssh-keycat.pam
    "6": sshd.sysconfig
    "7": sshd@.service
    "8": sshd.socket
    "9": sshd.service
    "10": sshd-keygen@.service
    "11": sshd-keygen
    "12": sshd.tmpfiles
    "13": sshd-keygen.target
    "14": ssh-agent.service
patchset:
    "0": openssh-6.7p1-coverity.patch
    "1": openssh-7.6p1-audit.patch
    "2": openssh-7.1p2-audit-race-condition.patch
    "3": pam_ssh_agent_auth-0.9.3-build.patch
    "4": pam_ssh_agent_auth-0.10.3-seteuid.patch
    "5": pam_ssh_agent_auth-0.9.2-visibility.patch
    "6": pam_ssh_agent_auth-0.9.3-agent_structure.patch
    "7": pam_ssh_agent_auth-0.10.2-compat.patch
    "8": pam_ssh_agent_auth-0.10.2-dereference.patch
    "9": openssh-7.8p1-role-mls.patch
    "10": openssh-6.6p1-privsep-selinux.patch
    "11": openssh-6.6p1-keycat.patch
    "12": openssh-6.6p1-allow-ip-opts.patch
    "13": openssh-6.6p1-keyperm.patch
    "14": openssh-5.9p1-ipv6man.patch
    "15": openssh-5.8p2-sigpipe.patch
    "16": openssh-7.2p2-x11.patch
    "17": openssh-7.7p1-fips.patch
    "18": openssh-5.1p1-askpass-progress.patch
    "19": openssh-4.3p2-askpass-grab-info.patch
    "20": openssh-7.7p1.patch
    "21": openssh-7.8p1-UsePAM-warning.patch
    "22": openssh-6.3p1-ctr-evp-fast.patch
    "23": openssh-8.0p1-gssapi-keyex.patch
    "24": openssh-6.6p1-force_krb.patch
    "25": openssh-6.6p1-GSSAPIEnablek5users.patch
    "26": openssh-7.7p1-gssapi-new-unique.patch
    "27": openssh-7.2p2-k5login_directory.patch
    "28": openssh-6.6p1-kuserok.patch
    "29": openssh-6.4p1-fromto-remote.patch
    "30": openssh-6.6.1p1-selinux-contexts.patch
    "31": openssh-6.6.1p1-log-in-chroot.patch
    "32": openssh-6.6.1p1-scp-non-existing-directory.patch
    "33": openssh-6.8p1-sshdT-output.patch
    "34": openssh-6.7p1-sftp-force-permission.patch
    "35": openssh-7.2p2-s390-closefrom.patch
    "36": openssh-7.3p1-x11-max-displays.patch
    "37": openssh-7.4p1-systemd.patch
    "38": openssh-7.6p1-cleanup-selinux.patch
    "39": openssh-7.5p1-sandbox.patch
    "40": openssh-8.0p1-pkcs11-uri.patch
    "41": openssh-7.8p1-scp-ipv6.patch
    "42": openssh-8.0p1-crypto-policies.patch
    "43": openssh-8.0p1-openssl-evp.patch
    "44": openssh-8.0p1-openssl-kdf.patch
    "45": openssh-8.2p1-visibility.patch
    "46": openssh-8.2p1-x11-without-ipv6.patch
    "47": openssh-8.0p1-keygen-strip-doseol.patch
    "48": openssh-8.0p1-preserve-pam-errors.patch
    "49": openssh-8.7p1-scp-kill-switch.patch
    "50": bugfix-sftp-when-parse_user_host_path-empty-path-should-be-allowed.patch
    "51": bugfix-openssh-6.6p1-log-usepam-no.patch
    "52": bugfix-openssh-add-option-check-username-splash.patch
    "53": feature-openssh-7.4-hima-sftpserver-oom-and-fix.patch
    "54": bugfix-openssh-fix-sftpserver.patch
    "55": set-sshd-config.patch
    "56": feature-add-SMx-support.patch
meta.description: |
    OpenSSH is the premier connectivity tool for remote login with the SSH protocol. \
    It encrypts all traffic to eliminate eavesdropping, connection hijacking, and \
    other attacks. In addition, OpenSSH provides a large suite of secure tunneling \
    capabilities, several authentication methods, and sophisticated configuration options.
requires:
    - "/sbin/nologin"
    - "libselinux >= 2.3-5 audit-libs >= 1.0.8"
    - "openssh-server = %{version}-%{release}"
buildRequires:
    - "gtk2-devel libX11-devel openldap-devel autoconf automake perl-interpreter perl-generators"
    - "zlib-devel audit-libs-devel >= 2.0.5 util-linux groff pam-devel"
    - "openssl-devel >= 0.9.8j perl-podlators systemd-devel gcc p11-kit-devel krb5-devel"
    - "libedit-devel ncurses-devel libselinux-devel >= 2.3-5 audit-libs >= 1.0.8 xauth gnupg2"
recommends:
    - p11-kit
rpmMacros:
    - "%global gtk2 1"
    - "%global pie 1"
    - "%{?no_gtk2:%global gtk2 0}"
    - "%global sshd_uid    74"
    - "%global openssh_release 6"
    - "%{?systemd_requires}"

subpackage:
    openssh-clients:
        meta.summary: An open source SSH client applications
        meta.description: OpenSSH is a free version of SSH (Secure SHell), a program for logging
into and executing commands on a remote machine. This package includes
the clients necessary to make encrypted connections to SSH servers.
        requires:
            - "openssh = %{version}-%{release}"
            - "crypto-policies >= 20180306-1"
    openssh-server:
        meta.summary: An open source SSH server daemon
        meta.description: OpenSSH is a free version of SSH (Secure SHell), a program for logging
into and executing commands on a remote machine. This package contains
the secure shell daemon (sshd). The sshd daemon allows SSH clients to
securely connect to your SSH server.
        requires:
            - "openssh = %{version}-%{release}"
            - "pam >= 1.0.1-3"
            - "crypto-policies >= 20180306-1"
        requiresPre:
            - "shadow"
    openssh-keycat:
        meta.summary: A mls keycat backend for openssh
        meta.description: OpenSSH mls keycat is backend for using the authorized keys in the
openssh in the mls mode.
        requires:
            - "openssh = %{version}-%{release}"
    openssh-askpass:
        meta.summary: A passphrase dialog for OpenSSH and X
        meta.description: OpenSSH is a free version of SSH (Secure SHell), a program for logging
into and executing commands on a remote machine. This package contains
an X11 passphrase dialog for OpenSSH.
        requires:
            - "openssh = %{version}-%{release}"
    pam_ssh_agent_auth:
        meta.summary: PAM module for authentication with ssh-agent
        version: 0.10.4
        release:
            - 4.%{openssh_release}
        meta.license: BSD
        meta.description: 
    openssh-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
