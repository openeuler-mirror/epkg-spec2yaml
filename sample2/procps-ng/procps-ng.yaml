name: procps-ng
meta.summary: Utilities that provide system information.
version: 3.3.17
release: 2
meta.license: GPL+ and GPLv2 and GPLv2+ and GPLv3+ and LGPLv2+
meta.homepage: https://sourceforge.net/projects/procps-ng/
sources:
    - http://downloads.sourceforge.net/%{name}/%{name}-%{version}.tar.xz
    - README.md
    - README.top
patchset:
    - 0001-top-fix-two-potential-alternate-display-mode-abends.patch
    - 0002-top-In-the-bye_bye-function-replace-fputs-with-the-w.patch
    - 0003-add-options-M-and-N-for-top.patch
    - 0004-top-exit-with-error-when-pid-overflow.patch
    - 0005-fix-a-fix-for-the-bye_bye-function.patch
meta.description: |
    The procps package contains a set of system utilities that provide
    system information. Procps includes ps, free, skill, pkill, pgrep,
    snice, tload, top, uptime, vmstat, pidof, pmap, slabtop, w, watch
    and pwdx.
buildRequires:
    - "ncurses-devel libtool autoconf automake gcc gettext-devel systemd-devel"
provides:
    - "procps = %{version}-%{release}"
    - "%{name}"
files: |
    %doc COPYING COPYING.LIB
    %{!?_licensedir:%global license %%doc}
    %license COPYING COPYING.LIB
    %{_libdir}/libprocps.so.*
    %{_bindir}/*
    %{_sbindir}/*
    %exclude %{_libdir}/libprocps.la
    %exclude /unwanted/*
    %exclude %{_libdir}/*.a
    
subpackage:
    - name: devel
      meta.summary: The devel for %{name}
      meta.description: System and process monitoring utilities
      requires:
          - "%{name} = %{version}-%{release}"
      provides:
          - "procps-devel = %{version}-%{release}"
      files: |
          %doc COPYING COPYING.LIB
          %{!?_licensedir:%global license %%doc}
          %license COPYING COPYING.LIB
          %{_libdir}/libprocps.so
          %{_libdir}/pkgconfig/libprocps.pc
          %{_includedir}/proc
          

    - name: i18n
      meta.summary: Internationalization pack for %{name}
      meta.description: The package is used for the Internationalization of %{name}
      requires:
          - "%{name} = %{version}-%{release}"
      buildArch: noarch
      files: 

      filesInput: |
          %{name}.lang
           

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %doc AUTHORS Documentation/bugs.md Documentation/FAQ NEWS README.md top/README.top Documentation/TODO
          %{_mandir}/man*
          

