subpackage.libxml2-devel.files: |
    %defattr(-, root, root)
    
    %doc NEWS README.md Copyright
    %doc doc/*.html doc/html doc/*.gif doc/*.png
    %doc doc/tutorial doc/libxml2-api.xml.gz
    %doc doc/examples
    %doc %dir %{_datadir}/gtk-doc/html/libxml2
    %doc %{_datadir}/gtk-doc/html/libxml2/*.devhelp2
    %doc %{_datadir}/gtk-doc/html/libxml2/*.html
    %doc %{_datadir}/gtk-doc/html/libxml2/*.png
    %doc %{_datadir}/gtk-doc/html/libxml2/*.css
    
    %{_libdir}/lib*.so
    %{_libdir}/*.sh
    %{_includedir}/*
    %{_bindir}/xml2-config
    %{_datadir}/aclocal/libxml.m4
    %{_libdir}/pkgconfig/libxml-2.0.pc
    %{_libdir}/cmake/libxml2/libxml2-config.cmake
    
    %{_libdir}/*a
    
    
subpackage.python3-%{name}.files: |
    %defattr(-, root, root)
    
    %{_libdir}/python3*/site-packages/libxml2.py*
    %{_libdir}/python3*/site-packages/drv_libxml2.py*
    %{_libdir}/python3*/site-packages/__pycache__/*py*
    %{_libdir}/python3*/site-packages/libxml2mod*
    %doc python/TODO
    %doc python/libxml2class.txt
    %doc py3doc/*.py
    %doc doc/python.html
    
    
subpackage.libxml2-help.files: |
    %doc %{_mandir}/man1/xml2-config.1*
    %doc %{_mandir}/man1/xmllint.1*
    %doc %{_mandir}/man1/xmlcatalog.1*
    %doc %{_mandir}/man3/libxml.3*
    
    
    
files: |
    %defattr(-, root, root)
    
    %doc %{_datadir}/doc/libxml2
    
    %{_libdir}/lib*.so.*
    %{_bindir}/xmllint
    %{_bindir}/xmlcatalog
    
    
