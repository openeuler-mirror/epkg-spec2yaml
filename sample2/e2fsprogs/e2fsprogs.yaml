name: e2fsprogs
meta.summary: Second extended file system management tools
version: 1.46.4
release: 16
meta.license: GPLv2+ and LGPLv2 and MIT
meta.homepage: "http://e2fsprogs.sourceforge.net/"
source:
    "0": https://www.kernel.org/pub/linux/kernel/people/tytso/%{name}/v%{version}/%{name}-%{version}.tar.xz
    "1": ext2_types-wrapper.h
patchset:
    "0": 0001-e2fsprogs-set-hugefile-from-4T-to-1T-in-hugefile-tes.patch
    "1": 0002-libss-add-newer-libreadline.so.8-to-dlopen-path.patch
    "2": 0003-tests-update-expect-files-for-f_mmp_garbage.patch
    "3": 0004-tests-update-expect-files-for-f_large_dir-and-f_larg.patch
    "4": 0005-resize2fs-resize2fs-disk-hardlinks-will-be-error.patch
    "5": 0006-e2fsck-exit-journal-recovery-when-find-EIO-ENOMEM-er.patch
    "6": 0007-e2fsck-exit-journal-recovery-when-jounral-superblock.patch
    "7": 0008-e2fsck-add-env-param-E2FS_UNRELIABLE_IO-to-fi.patch
    "8": 0009-e2mmpstatus.8.in-detele-filesystem-can-be-UUID-or-LA.patch
    "9": 0010-tests-update-expect-file-for-u_direct_io.patch
    "10": 0011-libext2fs-don-t-old-the-CACHE_MTX-while-doing-I-O.patch
    "11": 0012-tests-fix-ACL-printing-tests.patch
    "12": 0013-e2fsck-do-not-clean-up-file-acl-if-the-inode-is-trun.patch
    "13": 0014-e2fsck-handle-level-is-overflow-in-ext2fs_extent_get.patch
    "14": 0015-libext2fs-add-sanity-check-to-extent-manipulation.patch
    "15": 0016-e2fsprogs-add-sw64.patch
    "16": 0017-tune2fs-do-not-change-j_tail_sequence-in-journal-sup.patch
    "17": 0018-debugfs-teach-logdump-the-n-num_trans-option.patch
    "18": 0019-tune2fs-fix-tune2fs-segfault-when-ext2fs_run_ext3_jo.patch
    "19": 0020-tune2fs-tune2fs_main-should-return-rc-when-some-erro.patch
    "20": 0021-tune2fs-exit-directly-when-fs-freed-in-ext2fs_run_ext3_journal.patch
meta.description: |
    The e2fsprogs package consists of a lot of tools for users to create,
    check, modify, and correct any inconsistencies in second extended file
    system.
buildRequires:
    - "gcc pkgconfig texinfo"
    - "fuse-devel libblkid-devel libuuid-devel"
    - "audit"
provides:
    - "e2fsprogs-libs%{?_isa} e2fsprogs-libs"
    - "libcom_err%{?_isa} libcom_err"
    - "libss%{?_isa} libss"
obsoletes:
    - "e2fsprogs-libs"
    - "libcom_err"
    - "libss"
recommends:
    - "%{name}-help = %{version}-%{release}"
subpackage:
    e2fsprogs-devel:
        meta.summary: Second extended file system libraries and headers
        meta.license: GPLv2 and LGPLv2 and MIT
        meta.description: This package provides libraries and header files to develop
second extended file system userspace programs.
        requires:
            - "e2fsprogs = %{version}-%{release}"
            - "gawk"
            - "pkgconfig"
        requiresPreUn:
            - "info"
        requiresPost:
            - "info"
        provides:
            - "libcom_err-devel%{?_isa} libcom_err-devel"
            - "libss-devel%{?_isa} libss-devel"
            - "e2fsprogs-static{?_isa} e2fsprogs-static"
        obsoletes:
            - "libcom_err-devel"
            - "libss-devel"
            - "e2fsprogs-static"
        filesInput: "%{name}.lang"
    e2fsprogs-help:
        meta.summary: man files for e2fsprogs
        meta.description: This packages includes man files for e2fsprogs.
        requires:
            - "man"
        buildArch: noarch
