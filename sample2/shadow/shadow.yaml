name: shadow
meta.summary: Tools for managing accounts and shadow password files
version: 4.9
release: 4
epoch: 2
meta.license: BSD and GPLv2+
meta.homepage: http://pkg-shadow.alioth.debian.org/
sources:
    - https://github.com/shadow-maint/shadow/releases/download/v%{version}/shadow-%{version}.tar.xz
    - shadow-utils.useradd
    - shadow-utils.login.defs
    - shadow-bsd.txt
    - https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt
    - chpasswd
    - newusers
patchset:
    - shadow-4.8-goodname.patch
    - shadow-4.9-null-tm.patch
    - shadow-4.8-long-entry.patch
    - usermod-unlock.patch
    - useradd-create-directories-after-the-SELinux-user.patch
    - shadow-4.1.5.1-var-lock.patch
    - shadow-utils-fix-lock-file-residue.patch
    - Makefile-include-libeconf-dependency-in-new-idmap.patch
    - usermod-allow-all-group-types-with-G-option.patch
    - useradd-avoid-generating-an-empty-subid-range.patch
    - libmisc-fix-default-value-in-SHA_get_salt_rounds.patch
    - semanage-close-the-selabel-handle.patch
    - Revert-useradd.c-fix-memleaks-of-grp.patch
    - useradd-change-SELinux-labels-for-home-files.patch
    - libsubid-link-to-PAM-libraries.patch
    - Fix-out-of-tree-builds-with-respect-to-libsubid-incl.patch
    - Respect-enable-static-no-in-libsubid.patch
    - Fixes-the-linking-issues-when-libsubid-is-static-and.patch
    - pwck-fix-segfault-when-calling-fprintf.patch
    - newgrp-fix-segmentation-fault.patch
    - groupdel-fix-SIGSEGV-when-passwd-does-not-exist.patch
    - backport-useradd-modify-check-ID-range-for-system-users.patch
    - shadow-add-sm3-crypt-support.patch
meta.description: |
    This package includes the necessary programs for converting plain
    password files to the shadow password format and to manage user and
    group accounts.
requires:
    - "libselinux"
    - "audit-libs"
    - "setup"
requiresPre:
    - "coreutils"
requiresPost:
    - "coreutils"
buildRequires:
    - "gcc, libselinux-devel, audit-libs-devel, libsemanage-devel"
    - "libacl-devel, libattr-devel"
    - "bison, flex, gnome-doc-utils, docbook-style-xsl, docbook-dtds"
    - "autoconf, automake, libtool, gettext-devel, itstool, pam-devel"
provides:
    - "shadow-utils"
obsoletes:
    - "shadow-utils"
files: |
    %doc NEWS doc/HOWTO README
    %{!?_licensedir:%global license %%doc}
    %license gpl-2.0.txt shadow-bsd.txt
    %attr(0644,root,root)   %config(noreplace) %{_sysconfdir}/login.defs
    %attr(0644,root,root)   %config(noreplace) %{_sysconfdir}/default/useradd
    %{_bindir}/sg
    %attr(4755,root,root) %{_bindir}/chage
    %attr(4755,root,root) %{_bindir}/gpasswd
    %{_bindir}/lastlog
    %attr(4755,root,root) %{_bindir}/newgrp
    %attr(4755,root,root) %{_bindir}/newgidmap
    %attr(4755,root,root) %{_bindir}/newuidmap
    %{_sbindir}/adduser
    %attr(0755,root,root)   %{_sbindir}/user*
    %attr(0755,root,root)   %{_sbindir}/group*
    %{_sbindir}/grpck
    %{_sbindir}/pwck
    %{_sbindir}/*conv
    %{_sbindir}/chpasswd
    %{_sbindir}/chgpasswd
    %{_sbindir}/newusers
    %{_sbindir}/vipw
    %{_sbindir}/vigr
    %{_sysconfdir}/pam.d/chpasswd
    %{_sysconfdir}/pam.d/groupmems
    %{_sysconfdir}/pam.d/newusers
    
filesInput: shadow.lang

buildRoot:
    - "%{_tmppath}/%{name}-%{version}-%{release}-root-%(%{__id_u} -n)"
rpmMacros:
    - "%global includesubiddir %{_includedir}/shadow"

subpackage:
    - name: subid-devel
      meta.summary: Development package for shadow-utils-subid
      meta.license: BSD and GPLv2+
      meta.description: Development files for shadow-utils-subid.
      files: |
          %{_libdir}/libsubid.so.*
          %{includesubiddir}/subid.h
          %{_libdir}/libsubid.so
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - "man info"
      buildArch: noarch
      files: |
          %{_mandir}/*/*
          

