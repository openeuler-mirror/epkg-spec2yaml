name: audit
meta.summary: User space tools for kernel auditing
version: 3.0.1
release: 2
epoch: 1
meta.license: GPLv2+ and LGPLv2+
meta.homepage: "https://people.redhat.com/sgrubb/audit/"
source:
    "0": https://people.redhat.com/sgrubb/audit/%{name}-%{version}.tar.gz
    "1": https://www.gnu.org/licenses/lgpl-2.1.txt
patchset:
    "0": bugfix-audit-support-armv7b.patch
    "1": bugfix-audit-userspace-missing-syscalls-for-aarm64.patch
    "2": bugfix-audit-reload-coredump.patch
    "3": backport-Fix-the-default-location-for-zos-remote.conf-171.patch
    "4": backport-Add-missing-call-to-free_interpretation_list.patch
    "5": backport-fix-2-more-issues-found-by-fuzzing.patch
    "6": backport-Fix-an-auparse-memory-leak-caused-in-recent-glibc.patch
    "7": backport-Fix-double-free-with-corrupted-logs.patch
    "8": backport-Fix-the-closing-timing-of-audit_fd-166.patch
    "9": backport-Fix-some-string-length-issues.patch
    "10": backport-Move-the-free_config-to-success-path.patch
    "11": backport-Check-for-fuzzer-induced-invalid-value.patch
    "12": backport-error-out-if-log-is-mangled.patch
    "13": backport-Dont-run-off-the-end-with-corrupt-logs.patch
    "14": backport-Another-hardening-measure-for-corrupted-logs.patch
    "15": backport-Fix-busy-loop-in-normalizer-when-logs-are-corrupt.patch
    "16": backport-Better-fix-for-busy-loop-in-normalizer-when-logs-are.patch
    "17": backport-flush-uid-gid-caches-when-user-group-added-deleted-m.patch
    "18": backport-In-auditd-check-if-log_file-is-valid-before-closing-.patch
    "19": backport-Check-ctime-return-code.patch
    "20": backport-When-interpreting-if-val-is-NULL-return-an-empty-str.patch
    "21": backport-auditd.service-Restart-on-failure-ignoring-some-exit.patch
    "22": backport-0001-In-auditd-close-the-logging-file-descriptor-when-log.patch
    "23": backport-0002-In-auditd-close-the-logging-file-descriptor-when-log.patch
meta.description: |
    The audit package contains the user space utilities for storing and searching
    the audit records generated by the audit subsystem in the Linux 2.6 and later
    kernels.
requires:
    - "%{name}-libs = %{epoch}:%{version}-%{release}"
requiresPreUn:
    - "systemd"
requiresPost:
    - "systemd coreutils"
requiresPostUn:
    - "systemd coreutils"
buildRequires:
    - "gcc swig libtool systemd kernel-headers >= 2.6.29"
    - "openldap-devel krb5-devel libcap-ng-devel"
    - "golang %ifarch %{golang_arches}"
subpackage:
    audit-libs:
        meta.summary: Dynamic library for libaudit
        meta.license: LGPLv2+
        meta.description: The audit-libs package contains the dynamic libraries needed for
applications to use the audit framework.
    audispd-plugins:
        meta.summary: Plugins for audit event dispatcher
        meta.license: GPLv2+
        meta.description: This package provides plugins for the real-time interface to audispd.
        requires:
            - "%{name} = %{epoch}:%{version}-%{release}"
            - "%{name}-libs = %{epoch}:%{version}-%{release}"
    audispd-plugins-zos:
        meta.summary: z/OS plugin for audit event dispatcher
        meta.license: GPLv2+
        meta.description: This package provides a z/OS plugin for audit event dispatcher that
will forward audit events to a configured z/OS service management facility
database.
        requires:
            - "%{name} = %{epoch}:%{version}-%{release}"
            - "%{name}-libs = %{epoch}:%{version}-%{release}"
            - "openldap"
    audit-devel:
        meta.summary: Header files for libaudit
        meta.license: LGPLv2+
        meta.description: The audit-libs-devel package contains the header files needed for developing
applications that need to use the audit framework libraries.
        requires:
            - "%{name}%{?_isa} = %{epoch}:%{version}-%{release}"
            - "kernel-headers >= 2.6.29"
        provides:
            - "audit-libs-devel audit-libs-static"
    python3-audit:
        meta.summary: Python3 bindings for libaudit
        meta.license: LGPLv2+
        meta.description: The python3-audit package contains the bindings so that libaudit and
libauparse can be used by python3.
        requires:
            - "%{name}%{?_isa} = %{epoch}:%{version}-%{release}"
        buildRequires:
            - "python3-devel"
        provides:
            - "audit-libs-python3 = %{version}-%{release}"
            - "audit-libs-python3%{?_isa} = %{version}-%{release}"
        obsoletes:
            - "audit-libs-python3 < %{version}-%{release}"
    audit-help:
        meta.summary: Documents for %{name}
        meta.description: Man pages and other related documents for %{name}.
        requires:
            - "man info"
        buildArch: noarch
