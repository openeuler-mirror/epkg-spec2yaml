name: grep
meta.summary: A string search utility
version: 3.7
release: 7
meta.license: GPLv3+
meta.homepage: http://www.gnu.org/software/grep/
sources:
    - https://ftp.gnu.org/gnu/grep/grep-%{version}.tar.xz
    - color_grep.sh
    - colorgrep.csh
    - grepconf.sh
patchset:
    - backport-grep-avoid-sticky-problem-with-f-f.patch
    - backport-grep-s-does-not-suppress-binary-file-matches.patch
    - backport-grep-work-around-PCRE-bug.patch
    - backport-grep-migrate-to-pcre2.patch
    - backport-grep-Don-t-limit-jitstack_max-to-INT_MAX.patch
    - backport-grep-speed-up-fix-bad-UTF8-check-with-P.patch
    - backport-grep-fix-minor-P-memory-leak.patch
    - backport-grep-djb2-correction.patch
    - backport-build-update-gnulib-submodule-to-latest.patch
    - backport-grep-fix-bug-with-and-some-Hangul-Syllables.patch
    - backport-tests-improve-tests-of.patch
    - backport-grep-sanity-check-GREP_COLOR.patch
    - backport-grep-fix-regex-compilation-memory-leaks.patch
meta.description: |
    Grep searches one or more input files for lines containing a match to
    a specified pattern. By default, Grep outputs the matching lines.
buildRequires:
    - "gcc pcre2-devel texinfo gettext libsigsegv-devel automake"
provides:
    - "/bin/egrep /bin/fgrep /bin/grep bundled(gnulib)"
files: |
    %{_datadir}/locale/*
    %config(noreplace) %{_sysconfdir}/profile.d/color_grep.sh
    %config(noreplace) %{_sysconfdir}/profile.d/colorgrep.csh
    %doc NEWS README THANKS TODO
    %license COPYING AUTHORS
    %{_bindir}/*grep
    %{_libexecdir}/grepconf.sh
    %{_infodir}/grep.info.gz
    %{_mandir}/man1/*grep.1.gz
    
    
