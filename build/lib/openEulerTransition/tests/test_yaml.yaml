Name: atlas
Summary: Automatically Tuned Linear Algebra Software
Version: 3.10.3
Release: 11
License: BSD
URL: http://math-atlas.sourceforge.net/
Sources:
    - http://downloads.sourceforge.net/math-atlas/%{name}%{version}.tar.bz2
    - PPRO32.tgz
    - README.dist
    - POWER332.tar.bz2
    - IBMz932.tar.bz2
    - IBMz964.tar.bz2
    - ARMv732NEON.tar.bz2
    - IBMz1264.tar.bz2
    - ARMa732.tar.bz2
Patches:
    - atlas-melf.patch
    - atlas-shared_libraries.patch
    - atlas-genparse.patch
    - atlas.3.10.1-unbundle.patch
    - 0001-sed-tune-macro-value-to-repair-binary-diffence.patch
    - atl-date-to-eliminate-difference.patch
    - ret-iaff-to-eliminate-difference.patch
    - mv-res-taffinity.patch
    - atlas-compatible-with-hcc.patch
    - 0001-fix-gcc-version-check.patch
    - atlas-riscv64-port.patch
Description: |
    The ATLAS (Automatically Tuned Linear Algebra Software) project is an
    ongoing research effort focusing on applying empirical techniques in
    order to provide portable performance. At present, it provides C and
    Fortran77 interfaces to a portably efficient BLAS implementation, as
    well as a few routines from LAPACK
BuildRequires:
    - "gcc-gfortran, lapack-devel, gcc"
Obsoletes:
    - "atlas-sse3 < 3.10.3-1 %ifarch x86_64"
Files: |
    %doc doc/README.dist
    %dir %{_libdir}/atlas
    %{_libdir}/atlas/*.so.*
    %config(noreplace) /etc/ld.so.conf.d/atlas-%{_arch}.conf

Install:
    - atlas.sh
Build:
    - atlas.sh
Post:
    - atlas.sh
Postun:
    - atlas.sh
Check:
    - atlas.sh
Prep:
    - atlas.sh
Macros:
    - "%global _hardened_build 1"
    - "%define types base"
    - "%define types base corei2 %ifarch x86_64"
SubPackages:
    - Name: devel
      Summary: Development libraries for ATLAS
      Description: |
          This package contains headers and static librariesfor development with
          ATLAS (Automatically Tuned Linear Algebra Software).
      Requires:
          - "%{name} = %{version}-%{release}"
      RequiresPostUn:
          - "chkconfig"
      Provides:
          - "%{name}-static = %{version}-%{release}"
      Obsoletes:
          - "%{name}-header <= %{version}-%{release}"
          - "%{name}-static < %{version}-%{release}"
          - "atlas-sse3-devel < 3.10.3-1 %ifarch x86_64"
          - "atlas-sse3-static < 3.10.3-1 %ifarch x86_64"
      Files: |
          %doc doc
          %{_libdir}/atlas/*.so
          %{_libdir}/atlas/*.a
          %{_includedir}/atlas-%{_arch}-base/
          %{_includedir}/*.h
          %ghost %{_includedir}/atlas
          %{_libdir}/pkgconfig/atlas.pc

      Requires(posttrans):
          - "chkconfig"
      Postun:
          - atlas.sh
      Posttrans:
          - atlas.sh

    - Name: corei2 %ifarch x86_64

      Summary: ATLAS libraries for Corei2 (Ivy/Sandy bridge) CPUs

    - Name: corei2-devel %ifarch x86_64

      Summary: ATLAS development libraries for ATLAS for Corei2 (Ivy/Sandy bridge) CPUs
      Requires:
          - "%{name}-corei2 = %{version}-%{release}"
      RequiresPostUn:
          - "chkconfig"
      Provides:
          - "%{name}-corei2-static = %{version}-%{release}"
      Obsoletes:
          - "%{name}-header <= %{version}-%{release}"
          - "%{name}-corei2-static < %{version}-%{release}"
      Requires(posttrans):
          - "chkconfig"

    - Name: atlas-corei2
      AsWholeName: yes
      Post:
          - atlas.sh
      Postun:
          - atlas.sh
