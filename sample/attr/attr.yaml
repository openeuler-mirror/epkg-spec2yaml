meta:
    summary: Commands for Manipulating Filesystem Extended Attributes
    homepage: "https://savannah.nongnu.org/projects/attr"
    description: |
        A set of tools for manipulating extended attributes on filesystem
        objects, in particular getfattr(1) and setfattr(1).
        An attr(1) command is also provided which is largely compatible
        with the SGI IRIX tool of the same name.
name: attr
version: "2.5.1"
release: 2
license: GPLv2+ AND LGPLv2+
buildRequires:
    - "gettext"
    - "libtool"
    - "chrpath"
    - "gcc"
provides:
    - "libattr"
obsoletes:
    - "libattr"
conflicts:
    - "xfsdump < 3.1.8"
    - "filesystem < 3"
source:
    0: https://download-mirror.savannah.gnu.org/releases/attr/attr-%{version}.tar.gz

patchset:
    1: 0001-bypass-wrong-output-when-enabled-selinux.patch
    2: 0002-dont-skip-security.evm-when-copy-xattr.patch
rpmMacros: |
    %{!?_licensedir:%global license \\%\\%doc}
    


subpackage.libattr-devel:
    meta:
        summary: Header files for libattr
        description: |
            This package contains header files and documentation needed to
            develop programs which make use of extended attributes.
            For Linux programs, the documented system call API is the
            recommended interface, but an SGI IRIX compatibility interface
            is also provided.

    license: LGPLv2+
    requires:
        - "glibc-headers"
    obsoletes:
        - "libattr"
subpackage.attr-help:
    meta:
        summary: Including man files for attr
        description: |
            This contains man files for the using of attr

    requires:
        - "man"
