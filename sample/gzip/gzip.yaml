name: gzip
meta.summary: A data compression utility
version: 1.12
release: 3
meta.license: GPLv3
meta.homepage: https://www.gnu.org/software/gzip
sources:
    - https://ftp.gnu.org/gnu/gzip/gzip-%{version}.tar.xz
    - colorzgrep.csh
    - colorzgrep.sh
patchset:
    - backport-gzip-detect-invalid-input.patch
    - backport-gzip-test-invalid-input-bug.patch
    - fix-verbose-disable.patch
    - performance-neoncrc32-and-prfm.patch
meta.description: |
    gzip is a single-file/stream lossless data compression
    utility, where the resulting compressed file generally
    has the suffix .gz.
requires:
    - coreutils
buildRequires:
    - gcc texinfo less autoconf automake
provides:
    - /bin/gunzip
    - /bin/gzip
    - /bin/zcat
    - bundled(gnulib)
conflicts:
    - filesystem < 3
files: |
    %defattr(-,root,root)
    %doc AUTHORS ChangeLog README
    %license COPYING
    %{_bindir}/*
    %{profiledir}/*
    %exclude %{_infodir}/dir
    
subpackage:
    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
      files: |
          %doc NEWS TODO THANKS
          %{_infodir}/*info*
          %{_mandir}/man1/*
          

