meta:
    summary: A data compression utility
    homepage: "https://www.gnu.org/software/gzip"
    description: |
        gzip is a single-file/stream lossless data compression
        utility, where the resulting compressed file generally
        has the suffix .gz.
name: gzip
version: "1.12"
release: 3
license: GPLv3
requires:
    - "coreutils"
buildRequires:
    - "gcc"
    - "texinfo"
    - "less"
    - "autoconf"
    - "automake"
provides:
    - "/bin/gunzip"
    - "/bin/gzip"
    - "/bin/zcat"
    - "bundled(gnulib)"
conflicts:
    - "filesystem < 3"

source:
    0: https://ftp.gnu.org/gnu/gzip/gzip-%{version}.tar.xz
    1: colorzgrep.csh
    2: colorzgrep.sh
patchset:
    6000: backport-gzip-detect-invalid-input.patch
    6001: backport-gzip-test-invalid-input-bug.patch
    9000: fix-verbose-disable.patch
    9001: performance-neoncrc32-and-prfm.patch
subpackage.gzip-help:
    meta:
        summary: Documents for %{name}
        description: |
            Man pages and other related documents for %{name}.

    requires:
        - "man"
        - "info"
    buildArch: noarch
