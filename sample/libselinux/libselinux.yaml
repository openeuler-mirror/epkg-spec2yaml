name: libselinux
meta.summary: SELinux library and simple utilities
version: 3.3
release: 2
meta.license: Public Domain
meta.homepage: https://github.com/SELinuxProject/selinux/wiki
sources:
    - https://github.com/SELinuxProject/selinux/releases/download/3.3/libselinux-3.3.tar.gz
patchset:
    - backport-libselinux-Close-leaked-FILEs.patch
    - backport-libselinux-free-memory-on-selabel_open-3-failure.patch
    - backport-libselinux-restorecon-misc-tweaks.patch
    - backport-libselinux-free-memory-in-error-branch.patch
    - backport-libselinux-restorecon-avoid-printing-NULL-pointer.patch
    - do-malloc-trim-after-load-policy.patch
meta.description: |
    libselinux provides an interface to get and set process and file
    security contexts and to obtain security policy decisions.
requires:
    - libsepol >= %{libsepol_version} pcre2
buildRequires:
    - gcc
    - python3-devel
    - systemd
    - swig
    - pcre2-devel
    - xz-devel
    - ruby-devel
    - libsepol-static
provides:
    - %{name}-utils = %{version}-%{release}
obsoletes:
    - %{name}-utils < %{version}-%{release}
conflicts:
    - filesystem < 3, selinux-policy-base < 3.13.1-138
files: |
    %license LICENSE
    %{_libdir}/libselinux.so.*
    %{_sbindir}/{selabel_lookup_best_match,selabel_partial_match,selinux_check_access}
    %{_sbindir}/{avcstat,getenforce,getsebool,matchpathcon,sefcontext_compile,selinuxconlist}
    %{_sbindir}/{selinuxdefcon,selinuxexeccon,selinuxenabled,setenforce,selabel_digest,selabel_lookup}
    %{_sbindir}/{selabel_get_digests_all_partial_matches,validatetrans}
    %dir %{_rundir}/setrans/
    %{_tmpfilesdir}/libselinux.conf
    
rpmMacros:
    - "%global ruby_inc %(pkg-config --cflags ruby)"
    - "%global libsepol_version 3.3"

subpackage:
    devel:
      meta.summary: Header files and libraries used to build SELinux
      meta.description: |
          libselinux provides an interface to get and set process and file
          security contexts and to obtain security policy decisions.
      requires:
          - libsepol-devel >= %{libsepol_version}
      provides:
          - %{name}-static = %{version}-%{release}
      obsoletes:
          - %{name}-static < %{version}-%{release}

    python3-libselinux:
      meta.summary: SELinux python3 bindings for libselinux
      meta.description: |
          The libselinux-python3 package contains the python bindings for developing
          SELinux applications.
      provides:
          - %{name}-python3 = %{version}-%{release}
      obsoletes:
          - %{name}-python3 < %{version}-%{release}
          
      AsWholeName: yes

    ruby:
      meta.summary: SELinux ruby bindings for libselinux
      meta.description: |
          The libselinux-ruby package contains the ruby bindings for developing
          SELinux applications.
      provides:
          - ruby(selinux)
          

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
          

env.configureFlags: |
