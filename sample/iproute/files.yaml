files: |
    %defattr(-,root,root)
    %license COPYING
    %doc README
    %attr(644,root,root) %config(noreplace) %{_sysconfdir}/iproute2/*
    %{_sbindir}/*
    %{_libdir}/tc/*
    %{_datadir}/bash-completion/completions/*

subpackage.devel.files: |
    %defattr(-,root,root)
    %license COPYING
    %{_libdir}/libnetlink.a
    %{_includedir}/*

subpackage.help.files: |
    %defattr(-,root,root)
    %doc README
    %{_mandir}/*