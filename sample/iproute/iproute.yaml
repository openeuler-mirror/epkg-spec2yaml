name: iproute
meta.summary: Linux network configuration utilities
version: 5.15.0
release: 5
meta.license: GPLv2+ and Public Domain
meta.homepage: https://kernel.org/pub/linux/utils/net/iproute2/
sources:
    - https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-%{version}.tar.xz
patchset:
    - bugfix-iproute2-3.10.0-fix-maddr-show.patch
    - bugfix-iproute2-change-proc-to-ipnetnsproc-which-is-private.patch
    - backport-devlink-fix-devlink-health-dump-command-without-arg.patch
    - backport-ip-Fix-size_columns-for-very-large-values.patch
    - backport-ip-Fix-size_columns-invocation-that-passes-a-32-bit-.patch
    - backport-l2tp-fix-typo-in-AF_INET6-checksum-JSON-print.patch
    - backport-libnetlink-fix-socket-leak-in-rtnl_open_byproto.patch
    - backport-lnstat-fix-buffer-overflow-in-header-output.patch
    - backport-lnstat-fix-strdup-leak-in-w-argument-parsing.patch
    - backport-q_cake-allow-changing-to-diffserv3.patch
    - backport-tc-em_u32-fix-offset-parsing.patch
    - backport-tc-flower-Fix-buffer-overflow-on-large-labels.patch
    - backport-tc_util-Fix-parsing-action-control-with-space-and-sl.patch
    - backport-tipc-fix-keylen-check.patch
    - backport-bridge-Fix-memory-leak-when-doing-fdb-get.patch
    - backport-ip-address-Fix-memory-leak-when-specifying-device.patch
    - backport-ip-neigh-Fix-memory-leak-when-doing-get.patch
    - backport-mptcp-Fix-memory-leak-when-doing-endpoint-show.patch
    - backport-mptcp-Fix-memory-leak-when-getting-limits.patch
meta.description: |
    Iproute2 is a collection of user-space utilities to set up networking
    under Linux from the command-line. It can inspect and configure,
    among other things: interface paramters, IP addresses, routing,
    tunnels, bridges, packet transformations (IPsec, etc.), and Quality
    of Service.
requires:
    - libbpf psmisc
buildRequires:
    - gcc bison elfutils-libelf-devel flex iptables-devel
    - libmnl-devel libselinux-devel pkgconfig libbpf-devel
provides:
    - /sbin/ip iproute-tc tc
obsoletes:
    - iproute-tc
    
subpackage:
    devel:
      meta.summary: Header files for iprout2
      meta.license: GPLv2+
      meta.description: Header files for iprout2
      provides:
          - iproute-static = %{version}-%{release}
      obsoletes:
          - iproute-static < %{version}-%{release}
          

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch