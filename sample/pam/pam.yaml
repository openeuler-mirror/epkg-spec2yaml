name: pam
meta.summary: Pluggable Authentication Modules for Linux
version: 1.5.2
release: 2
meta.license: BSD and GPLv2+
meta.homepage: http://www.linux-pam.org/
sources:
    - https://github.com/linux-pam/linux-pam/releases/download/v%{version}/Linux-PAM-%{version}.tar.xz
    - https://github.com/linux-pam/linux-pam/releases/download/v%{version}/Linux-PAM-%{version}.tar.xz.asc
    - other.pamd
    - system-auth.pamd
    - password-auth.pamd
    - config-util.pamd
    - pamtmp.conf
    - postlogin.pamd
    - https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt
patchset:
    - bugfix-pam-1.1.8-faillock-systemtime.patch
    - openEuler-change-ndbm-to-gdbm.patch
    - 0001-bugfix-cannot-open-database-file.patch
    - add-sm3-crypt-support.patch
meta.description: |
    PAM (Pluggable Authentication Modules) is a system of libraries that
    handle the authentication tasks of applications (services) on the system.
requires:
    - cracklib
    - libpwquality
    - coreutils
    - glibc
    - audit-libs
    - libselinux
    - libxcrypt-sm3
buildRequires:
    - autoconf
    - automake
    - libtool
    - bison
    - flex
    - sed
    - cracklib-devel
    - gdbm-devel
    - perl-interpreter
    - pkgconfig
    - gettext-devel
    - libtirpc-devel
    - libnsl2-devel
    - audit-libs-devel
    - libselinux-devel
provides:
    - %{name}-sm3 = %{version}-%{release}

filesInput: Linux-PAM.lang

Post:
    - pam.sh
Postun:
    - pam.sh
rpmMacros:
    - "%define _pamlibdir %{_libdir}"
    - "%define _moduledir %{_libdir}/security"
    - "%define _secconfdir %{_sysconfdir}/security"
    - "%define _pamconfdir %{_sysconfdir}/pam.d"

subpackage:
    devel:
      meta.summary: Development files for Linux-PAM
      meta.description: %{summary}.
      requires:
          - pam = %{version}-%{release}

    help:
      meta.summary: Man pages for Linux-PAM
      meta.description: %{summary}.
      buildArch: noarch
env.configureFlags: |
    --disable-rpath
    --disable-static
    --disable-prelude
    --enable-db=ndbm
