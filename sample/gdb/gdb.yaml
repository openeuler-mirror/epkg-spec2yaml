meta.description: |
    GDB, the GNU Project debugger, allows you to see what is going on inside
    another program while it executes -- or what another program was doing
    at the moment it crashed.
    
    This package is only a stub to install gcc-gdb-plugin for 'compile' commands.
    See package 'gdb-headless'.
requires:
    - gdb-headless = %{version}-%{release}
conflicts:
    - gdb-headless < 7.12-29
files: |
    %license COPYING3 COPYING COPYING.LIB COPYING3.LIB
    %doc README NEWS
    %{_bindir}/gdb
    %{_bindir}/gcore
    %{_bindir}/gstack
    %{_bindir}/pstack
    %{_includedir}/gdb
    
recommends:
    - gcc-gdb-plugin
    - dnf-command(debuginfo-install)
rpmMacros:
    - "%global gdb_src gdb-11.1"
    - "%global gdb_build build-%{_target_platform}"
    - "%global __python %{__python3}"
    - "%undefine _debuginfo_subpackages"
    - "%global librpmso librpm.so.9"

subpackage:
    - name: headless
      meta.summary: The GNU Project debugger for C, C++, Fortran, Go and other languages
      meta.description: |
          GDB, the GNU Project debugger, allows you to see what is going on inside
          another program while it executes -- or what another program was doing
          at the moment it crashed.
      buildRequires:
          - rpm-libs autoconf
          - readline-devel >= 6.2-4
          - gcc-c++ ncurses-devel texinfo gettext flex bison
          - expat-devel xz-devel rpm-devel zlib-devel libselinux-devel
          - python3-devel texinfo-tex
          - perl-podlators libbabeltrace-devel guile-devel mpfr-devel
          - libipt-devel %ifarch %{ix86} x86_64
      provides:
          - bundled(libiberty) = 20180828
          - bundled(gnulib) = 20161115
          - bundled(binutils) = 20180828
          - bundled(md5-gcc) = 20180828
      conflicts:
          - elfutils < 0.149
      files: |
          %{_prefix}/libexec/gdb
          %config(noreplace) %{_sysconfdir}/gdbinit
          %{_sysconfdir}/gdbinit.d
          %{_bindir}/gdb-add-index
          %{_datadir}/gdb
          
      recommends:
          - default-yama-scope
          - %{librpmso}()(64bit)

    - name: gdbserver
      meta.summary: A standalone server for GDB (the GNU source-level debugger)
      meta.description: |
          GDB, the GNU Project debugger, allows you to see what is going on inside
          another program while it executes -- or what another program was doing
          at the moment it crashed.
          
          This package provides a program that allows you to run GDB on a different
          machine than the one which is running the program being debugged.
      files: |
          %{_bindir}/gdbserver
          %ifnarch riscv64
          %{_libdir}/libinproctrace.so
          %endif
          

    - name: help
      meta.summary: Documentation for GDB (the GNU Project debugger)
      meta.license: GFDL
      meta.description: |
          GDB, the GNU Project debugger, allows you to see what is going on inside
          another program while it executes -- or what another program was doing
          at the moment it crashed.
          
          This package provides INFO, HTML and PDF user manual for GDB.
      buildArch: noarch
      files: |
          %{_mandir}/*/gcore.1*
          %{_mandir}/*/gstack.1*
          %{_mandir}/*/pstack.1*
          %{_mandir}/*/gdb.1*
          %{_mandir}/*/gdbinit.5*
          %{_mandir}/*/gdb-add-index.1*
          %{_mandir}/*/gdbserver.1*
          %doc %{gdb_build}/gdb/doc/{gdb,annotate}.{html,pdf}
          %{_infodir}/annotate.info*
          %{_infodir}/gdb.info*
          

