name: kexec-tools
meta.summary: The kexec/kdump userspace component
version: 2.0.23
release: 8
meta.license: GPLv2
meta.homepage: https://www.kernel.org/
sources:
    - http://kernel.org/pub/linux/utils/kernel/kexec/%{name}-%{version}.tar.xz
    - kdumpctl
    - kdump.sysconfig
    - kdump.sysconfig.x86_64
    - kdump.sysconfig.i386
    - kdump.sysconfig.ppc64
    - mkdumprd
    - kdump.conf
    - https://github.com/makedumpfile/makedumpfile/releases/download/%{mkdf_ver}/makedumpfile-%{mkdf_ver}.tar.gz
    - mkdumprd.8
    - 98-kexec.rules
    - kdump.conf.5
    - kdump.service
    - kdump.sysconfig.s390x
    - https://github.com/lucchouina/eppic/archive/%{eppic_ver}/eppic-%{eppic_shortver}.tar.gz
    - kdump-lib.sh
    - kdump-in-cluster-environment.txt
    - kdump-dep-generator.sh
    - kdump-lib-initramfs.sh
    - kdump.sysconfig.ppc64le
    - kdumpctl.8
    - live-image-kdump-howto.txt
    - early-kdump-howto.txt
    - kdump-udev-throttler
    - kdump.sysconfig.aarch64
    - dracut-kdump.sh
    - dracut-module-setup.sh
    - dracut-monitor_dd_progress
    - dracut-kdump-error-handler.sh
    - dracut-kdump-emergency.service
    - dracut-kdump-error-handler.service
    - dracut-kdump-capture.service
    - dracut-kdump-emergency.target
    - dracut-early-kdump.sh
    - dracut-early-kdump-module-setup.sh
    - dracut-kdump-wait-for-target.sh
patchset:
    - arm64-support-more-than-one-crash-kernel-regions.patch
    - add-secure-compile-options-for-makedumpfile.patch
    - kexec-Add-quick-kexec-support.patch
    - kexec-Quick-kexec-implementation-for-arm64.patch
    - arm64-crashdump-deduce-paddr-of-_text-based-on-kerne.patch
    - arm64-make-phys_offset-signed.patch
    - arm64-crashdump-unify-routine-to-get-page_offset.patch
    - arm64-read-VA_BITS-from-kcore-for-52-bits-VA-kernel.patch
    - arm64-fix-PAGE_OFFSET-calc-for-flipped-mm.patch
meta.description: |
    kexec-tools provides /sbin/kexec binary that facilitates a new
    kernel to boot using the kernel's kexec feature either on a
    normal or a panic reboot. This package contains the /sbin/kexec
    binary and ancillary utilities that together form the userspace
    component of the kernel's kexec feature.
requires:
    - dracut >= 047-34.git20180604
    - dracut-network >= 044-117
    - dracut-squash >= 049-4
    - ethtool
    - systemd-udev%{?_isa} %ifnarch s390x
requiresPre:
    - coreutils sed zlib
requiresPreUn:
    - systemd
requiresPost:
    - systemd
requiresPostUn:
    - systemd
buildRequires:
    - zlib-devel elfutils-devel-static glib2-devel bzip2-devel ncurses-devel bison flex lzo-devel snappy-devel
    - pkgconfig intltool gettext
    - systemd-units
    - automake autoconf libtool
obsoletes:
    - diskdumputils netdump kexec-tools-eppic %ifarch %{ix86} x86_64
files: |
    %doc News
    %doc TODO
    %license COPYING
    %config(noreplace,missingok) %{_sysconfdir}/sysconfig/kdump
    %config(noreplace,missingok) %verify(not mtime) %{_sysconfdir}/kdump.conf
    %config %{_udevrulesdir}
    %{_udevrulesdir}/../kdump-udev-throttler
    %dir %{_localstatedir}/crash
    /usr/sbin/kexec
    /usr/sbin/mkdumprd
    /usr/sbin/vmcore-dmesg
    %{_bindir}/*
    %{_datadir}/kdump
    %{_prefix}/lib/kdump
    %{dracutlibdir}/modules.d/*
    %{_unitdir}/kdump.service
    %{_prefix}/lib/systemd/system-generators/kdump-dep-generator.sh
    %ifarch %{ix86} x86_64 aarch64
    %{_libdir}/eppic_makedumpfile.so
    /usr/share/makedumpfile/
    %endif
    %ifarch %{ix86} x86_64 aarch64
    %{_sysconfdir}/makedumpfile.conf.sample
    %endif
    %ifarch %{ix86} x86_64 aarch64
    /usr/sbin/makedumpfile
    %endif
    
Preun:
    - kexec-tools.sh
Post:
    - kexec-tools.sh
Postun:
    - kexec-tools.sh
rpmMacros:
    - "%global eppic_ver e8844d3793471163ae4a56d8f95897be9e5bd554"
    - "%global eppic_shortver %(c=%{eppic_ver}; echo ${c:0:7})"
    - "%global mkdf_ver 1.7.0"
    - "%undefine _hardened_build"

subpackage:
    - name: help
      meta.summary: Doc files for %{name}
      meta.description: The %{name}-help package contains doc files for %{name}.
      buildArch: noarch
      files: |
          %doc early-kdump-howto.txt
          %doc kdump-in-cluster-environment.txt
          %doc live-image-kdump-howto.txt
          %{_mandir}/man8/kdumpctl.8.gz
          %{_mandir}/man8/kexec.8.gz
          %{_mandir}/man8/mkdumprd.8.gz
          %{_mandir}/man8/vmcore-dmesg.8.gz
          %{_mandir}/man5/*
          %ifarch %{ix86} x86_64 aarch64
          %{_mandir}/man8/makedumpfile.8.gz
          %endif
          

