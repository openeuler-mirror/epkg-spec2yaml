name: libxml2
meta.summary: Library providing XML and HTML support
version: 2.9.14
release: 2
group: Development/Libraries
meta.license: MIT
meta.homepage: http://xmlsoft.org/
sources:
    - https://download.gnome.org/sources/%{name}/2.9/%{name}-%{version}.tar.xz
patchset:
    - libxml2-multilib.patch
    - Fix-memleaks-in-xmlXIncludeProcessFlags.patch
    - Fix-memory-leaks-for-xmlACatalogAdd.patch
    - Fix-memory-leaks-in-xmlACatalogAdd-when-xmlHashAddEntry-failed.patch
meta.description: |
    This library allows to manipulate XML files. It includes support
    to read, modify and write XML and HTML files. There is DTDs support
    this includes parsing and validation even with complex DtDs, either
    at parse time or later once the document has been modified. The output
    can be a simple SAX stream or and in-memory DOM like representations.
    In this case one can use the built-in XPath and XPointer implementation
    to select sub nodes or ranges. A flexible Input/Output mechanism is
    available, with existing HTTP and FTP modules and combined to an
    URI library.
buildRequires:
    - python3-devel
    - zlib-devel
    - pkgconfig
    - xz-devel
    - libtool
files: |
    %defattr(-, root, root)
    
    %doc %{_datadir}/doc/libxml2
    
    %{_libdir}/lib*.so.*
    %{_bindir}/xmllint
    %{_bindir}/xmlcatalog
    
Post:
    - libxml2.sh
Postun:
    - libxml2.sh
buildRoot:
    - %{_tmppath}/%{name}-%{version}-root
subpackage:
    - name: devel
      meta.summary: Libraries, includes, etc. to develop XML and HTML applications
      group: Development/Libraries
      meta.description: |
          Libraries, include files, etc you can use to develop XML applications.
          This library allows to manipulate XML files. It includes support
          to read, modify and write XML and HTML files. There is DTDs support
          this includes parsing and validation even with complex DtDs, either
          at parse time or later once the document has been modified. The output
          can be a simple SAX stream or and in-memory DOM like representations.
          In this case one can use the built-in XPath and XPointer implementation
          to select sub nodes or ranges. A flexible Input/Output mechanism is
          available, with existing HTTP and FTP modules and combined to an
          URI library.
      requires:
          - libxml2 = %{version}-%{release}
          - zlib-devel
          - xz-devel
          - pkgconfig
      provides:
          - %{name}-static
      obsoletes:
          - %{name}-static < %{version}-%{release}
      files: |
          %defattr(-, root, root)
          
          %doc NEWS README.md Copyright
          %doc doc/*.html doc/html doc/*.gif doc/*.png
          %doc doc/tutorial doc/libxml2-api.xml.gz
          %doc doc/examples
          %doc %dir %{_datadir}/gtk-doc/html/libxml2
          %doc %{_datadir}/gtk-doc/html/libxml2/*.devhelp2
          %doc %{_datadir}/gtk-doc/html/libxml2/*.html
          %doc %{_datadir}/gtk-doc/html/libxml2/*.png
          %doc %{_datadir}/gtk-doc/html/libxml2/*.css
          
          %{_libdir}/lib*.so
          %{_libdir}/*.sh
          %{_includedir}/*
          %{_bindir}/xml2-config
          %{_datadir}/aclocal/libxml.m4
          %{_libdir}/pkgconfig/libxml-2.0.pc
          %{_libdir}/cmake/libxml2/libxml2-config.cmake
          
          %{_libdir}/*a
          

    - name: python3-%{name}
      meta.summary: Python 3 bindings for the libxml2 library
      group: Development/Libraries
      meta.description: |
          The libxml2-python3 package contains a Python 3 module that permits
          applications written in the Python programming language, version 3, to use the
          interface supplied by the libxml2 library to manipulate XML files.
          
          This library allows to manipulate XML files. It includes support
          to read, modify and write XML and HTML files. There is DTDs support
          this includes parsing and validation even with complex DTDs, either
          at parse time or later once the document has been modified.
      requires:
          - libxml2 = %{version}-%{release}
      provides:
          - %{name}-python3 = %{version}-%{release}
      obsoletes:
          - %{name}-python3 < %{version}-%{release}
      files: |
          %defattr(-, root, root)
          
          %{_libdir}/python3*/site-packages/libxml2.py*
          %{_libdir}/python3*/site-packages/drv_libxml2.py*
          %{_libdir}/python3*/site-packages/__pycache__/*py*
          %{_libdir}/python3*/site-packages/libxml2mod*
          %doc python/TODO
          %doc python/libxml2class.txt
          %doc py3doc/*.py
          %doc doc/python.html
          
      AsWholeName: yes

    - name: help
      meta.summary: Man page for libxml2
      meta.description: %{summary}.
      buildArch: noarch
      files: |
          %doc %{_mandir}/man1/xml2-config.1*
          %doc %{_mandir}/man1/xmllint.1*
          %doc %{_mandir}/man1/xmlcatalog.1*
          %doc %{_mandir}/man3/libxml.3*
          
          

