name: readline
meta.summary: Readline library for editing typed command lines
version: 8.1
release: 1
meta.license: GPLv3+
meta.homepage: http://tiswww.case.edu/php/chet/readline/rltop.html
sources:
    - http://git.savannah.gnu.org/cgit/readline.git/snapshot/%{name}-%{version}.tar.gz
patchset:
    - readline-8.0-shlib.patch
meta.description: |
    The GNU Readline library provides a set of functions for use by
    applications that allow users to edit command lines as they are
    typed in. Both Emacs and vi editing modes are available.The Readline
    library includes additional functions to maintain a list of
    previously-entered command lines, to recall and perhaps reedit those
    lines, and perform csh-like history expansion on previous commands.
buildRequires:
    - gcc
    - gcc-c++
    - ncurses-devel
    
subpackage:
    devel:
      meta.summary: Development Header files for readline library
      meta.description: |
          The GNU Readline library provides a set of functions for use by
          applications that allow users to edit command lines as they are
          typed in.
          
          This package contains Development header files for the readline
          library.
      requires:
          - ncurses-devel
      provides:
          - %{name}-static
      obsoletes:
          - %{name}-static

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
env.configureFlags: |
    --with-curses
