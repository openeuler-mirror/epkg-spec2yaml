name: logrotate
meta.summary: simplify the administration of log files
version: 3.20.1
release: 1
meta.license: GPLv2+
meta.homepage: https://github.com/logrotate/logrotate
sources:
    - https://github.com/logrotate/logrotate/releases/download/%{version}/logrotate-%{version}.tar.xz
patchset:
    - 0001-logrotate-3.20.1-lock-state-msg.patch
meta.description: |
    The logrotate utility is designed to simplify the administration of
    log files on a system which generates a lot of log files.  Logrotate
    allows for the automatic rotation compression, removal and mailing of
    log files.logrotate  Logrotate can be set to handle a log file daily, weekly,
    monthly or when the log file gets to a certain size.
requires:
    - coreutils
buildRequires:
    - acl gcc automake libacl-devel libselinux-devel popt-devel
files: |
    %defattr(-,root,root)
    %license COPYING
    %dir %{_sysconfdir}/cron.daily
    %config(noreplace) %{_sysconfdir}/cron.daily/logrotate
    %config(noreplace) %{_sysconfdir}/logrotate.conf
    %dir %{_sysconfdir}/logrotate.d
    %config(noreplace) %{_sysconfdir}/logrotate.d/*tmp
    %{_sbindir}/logrotate
    %dir %{_localstatedir}/lib/logrotate
    %ghost %verify(not size md5 mtime) %attr(0644, root, root) %{_localstatedir}/lib/logrotate/logrotate.status
    
Pre:
    - logrotate.sh
Preun:
    - logrotate.sh
Post:
    - logrotate.sh
Postun:
    - logrotate.sh
rpmMacros:
    - "%global _configure ../configure"

subpackage:
    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %doc ChangeLog.md
          %{_mandir}/man8/logrotate.8*
          %{_mandir}/man5/logrotate.conf.5*
          

