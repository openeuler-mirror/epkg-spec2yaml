name: openssl
meta.summary: Cryptography and SSL/TLS Toolkit
version: 1.1.1m
release: 7
epoch: 1
meta.license: OpenSSL and SSLeay
meta.homepage: https://www.openssl.org/
sources:
    - https://www.openssl.org/source/%{name}-%{version}.tar.gz
    - Makefile.certificate
patchset:
    - openssl-1.1.1-build.patch
    - openssl-1.1.1-fips.patch
    - CVE-2022-0778-Add-a-negative-testcase-for-BN_mod_sqrt.patch
    - CVE-2022-0778-Fix-possible-infinite-loop-in-BN_mod_sqrt.patch
    - CVE-2022-1292.patch
    - Backport-Support-raw-input-data-in-apps-pkeyutl.patch
    - Backport-Fix-no-ec-no-sm2-and-no-sm3.patch
    - Backport-Support-SM2-certificate-verification.patch
    - Backport-Guard-some-SM2-functions-with-OPENSSL_NO_SM2.patch
    - Backport-Add-test-cases-for-SM2-cert-verification.patch
    - Backport-Add-documents-for-SM2-cert-verification.patch
    - Backport-Fix-a-memleak-in-apps-verify.patch
    - Backport-Skip-the-correct-number-of-tests-if-SM2-is-disabled.patch
    - Backport-Make-X509_set_sm2_id-consistent-with-other-setters.patch
    - Backport-Support-SM2-certificate-signing.patch
    - Backport-Support-parsing-of-SM2-ID-in-hexdecimal.patch
    - Backport-Fix-a-double-free-issue-when-signing-SM2-cert.patch
    - Backport-Fix-a-document-description-in-apps-req.patch
    - Backport-Update-expired-SCT-certificates.patch
    - Backport-ct_test.c-Update-the-epoch-time.patch
    - Feature-Support-TLCP-protocol.patch
    - Feature-X509-command-supports-SM2-certificate-signing-with-default-sm2id.patch
    - CVE-2022-2068-Fix-file-operations-in-c_rehash.patch
    - CVE-2022-2097-Fix-AES-OCB-encrypt-decrypt-for-x86-AES-NI.patch
meta.description: |
    OpenSSL is a robust, commercial-grade, and full-featured toolkit for the
    Transport Layer Security (TLS) and Secure Sockets Layer (SSL) protocols.
requires:
    - coreutils %{name}-libs%{?_isa} = %{epoch}:%{version}-%{release}
buildRequires:
    - gcc perl make lksctp-tools-devel coreutils util-linux zlib-devel
provides:
    - openssl-SMx = %{epoch}:%{version}-%{release}
obsoletes:
    - openssl-SMx < %{epoch}:%{version}-%{release}
files: |
    %license LICENSE
    %doc AUTHORS CHANGES FAQ NEWS README
    %{_pkgdocdir}/Makefile.certificate
    %{_bindir}/openssl
    
rpmMacros:
    - "%define soversion 1.1"

subpackage:
    - name: libs
      meta.summary: A general purpose cryptography library with TLS implementation
      group: System Environment/Libraries
      meta.description: |
          The openssl-libs package contains the libraries that are used
          by various applications which support cryptographic algorithms
          and protocols.
      requires:
          - ca-certificates >= 2008-5
          - crypto-policies >= 20180730
      provides:
          - openssl-fips = %{epoch}:%{version}-%{release}
          - openssl-SMx-libs = %{epoch}:%{version}-%{release}
      obsoletes:
          - openssl < 1:1.0.1-0.3.beta3
          - openssl-fips < 1:1.0.1e-28
          - openssl-SMx-libs < %{epoch}:%{version}-%{release}
      files: |
          %defattr(-,root,root)
          %license LICENSE
          %dir %{_sysconfdir}/pki/tls
          %dir %{_sysconfdir}/pki/tls/certs
          %dir %{_sysconfdir}/pki/tls/misc
          %dir %{_sysconfdir}/pki/tls/private
          %config(noreplace) %{_sysconfdir}/pki/tls/openssl.cnf
          %config(noreplace) %{_sysconfdir}/pki/tls/ct_log_list.cnf
          %{_libdir}/libcrypto.so.%{version}
          %{_libdir}/libcrypto.so.%{soversion}
          %{_libdir}/libssl.so.%{version}
          %{_libdir}/libssl.so.%{soversion}
          %{_libdir}/engines-%{soversion}
          %attr(0644,root,root) %{_libdir}/.libcrypto.so.*.hmac
          %attr(0644,root,root) %{_libdir}/.libssl.so.*.hmac
          
      recommends:
          - openssl-pkcs11%{?_isa}
      Post:
          - openssl.sh
      Postun:
          - openssl.sh

    - name: perl
      meta.summary: Perl scripts provided with OpenSSL
      meta.description: |
          OpenSSL is a toolkit for supporting cryptography. The openssl-perl
          package provides Perl scripts for converting certificates and keys
          from other formats to the formats used by the OpenSSL toolkit.
      requires:
          - perl-interpreter
          - %{name}%{?_isa} = %{epoch}:%{version}-%{release}
      files: |
          %{_bindir}/c_rehash
          %{_bindir}/*.pl
          %{_bindir}/tsget
          %dir %{_sysconfdir}/pki/CA
          %dir %{_sysconfdir}/pki/CA/private
          %dir %{_sysconfdir}/pki/CA/certs
          %dir %{_sysconfdir}/pki/CA/crl
          %dir %{_sysconfdir}/pki/CA/newcerts
          
          %ldconfig_scriptlets libs
          

    - name: devel
      meta.summary: Development files for openssl
      meta.description: %{summary}.
      requires:
          - %{name}-libs%{?_isa} = %{epoch}:%{version}-%{release}
          - krb5-devel zlib-devel pkgconfig
      provides:
          - openssl-static = %{epoch}:%{version}-%{release} openssl-static%{?_isa} = %{epoch}:%{version}-%{release}
          - openssl-SMx-devel = %{epoch}:%{version}-%{release}
      obsoletes:
          - openssl-static < %{epoch}:%{version}-%{release}
          - openssl-SMx-devel < %{epoch}:%{version}-%{release}
      files: |
          %defattr(-,root,root)
          %doc doc/dir-locals.example.el doc/openssl-c-indent.el
          %{_prefix}/include/openssl
          %{_libdir}/pkgconfig/*.pc
          %{_libdir}/*.so
          %{_libdir}/*.a
          

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
      files: |
          %defattr(-,root,root)
          %{_mandir}/man1/*
          %{_mandir}/man3/*
          %{_mandir}/man5/*
          %{_mandir}/man7/*
          %{_pkgdocdir}/html/
          

