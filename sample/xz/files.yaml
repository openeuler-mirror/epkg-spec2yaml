files: |
    %defattr(-,root,root)
    %doc %{_pkgdocdir}
    %license %{_pkgdocdir}/COPYING*
    %{_bindir}/*xz*
    %{profiledir}/*

    %exclude %_pkgdocdir/examples*
    %exclude %{_libdir}/*.la

subpackage.devel.files: |
    %dir %{_includedir}/lzma
    %doc %_pkgdocdir/examples*
    %{_includedir}/lzma/*.h
    %{_includedir}/lzma.h

    %{_libdir}/pkgconfig/liblzma.pc
    %{_libdir}/liblzma.a
    %{_libdir}/*.so

subpackage.lzma-compat.files: |
    %{_bindir}/*lz*

subpackage.libs.files: |
    %{_libdir}/lib*.so.5*

subpackage.help.files: |
    %{_mandir}/man1/*lz*
    %{_mandir}/man1/*xz*
    %{_mandir}/de/man1/*lz*
    %{_mandir}/de/man1/*xz*
