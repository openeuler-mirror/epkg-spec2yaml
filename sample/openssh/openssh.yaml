name: openssh
meta.summary: An open source implementation of SSH protocol version 2
version: 8.8p1
release: %{openssh_release}
meta.license: BSD
meta.homepage: http://www.openssh.com/portable.html
sources:
    - https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz
    - https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz.asc
    - sshd.pam
    - http://prdownloads.sourceforge.net/pamsshagentauth/pam_ssh_agent_auth/pam_ssh_agent_auth-0.10.4.tar.gz
    - pam_ssh_agent-rmheaders
    - ssh-keycat.pam
    - sshd.sysconfig
    - sshd@.service
    - sshd.socket
    - sshd.service
    - sshd-keygen@.service
    - sshd-keygen
    - sshd.tmpfiles
    - sshd-keygen.target
    - ssh-agent.service
patchset:
    - openssh-6.7p1-coverity.patch
    - openssh-7.6p1-audit.patch
    - openssh-7.1p2-audit-race-condition.patch
    - pam_ssh_agent_auth-0.9.3-build.patch
    - pam_ssh_agent_auth-0.10.3-seteuid.patch
    - pam_ssh_agent_auth-0.9.2-visibility.patch
    - pam_ssh_agent_auth-0.9.3-agent_structure.patch
    - pam_ssh_agent_auth-0.10.2-compat.patch
    - pam_ssh_agent_auth-0.10.2-dereference.patch
    - openssh-7.8p1-role-mls.patch
    - openssh-6.6p1-privsep-selinux.patch
    - openssh-6.6p1-keycat.patch
    - openssh-6.6p1-allow-ip-opts.patch
    - openssh-6.6p1-keyperm.patch
    - openssh-5.9p1-ipv6man.patch
    - openssh-5.8p2-sigpipe.patch
    - openssh-7.2p2-x11.patch
    - openssh-7.7p1-fips.patch
    - openssh-5.1p1-askpass-progress.patch
    - openssh-4.3p2-askpass-grab-info.patch
    - openssh-7.7p1.patch
    - openssh-7.8p1-UsePAM-warning.patch
    - openssh-6.3p1-ctr-evp-fast.patch
    - openssh-8.0p1-gssapi-keyex.patch
    - openssh-6.6p1-force_krb.patch
    - openssh-6.6p1-GSSAPIEnablek5users.patch
    - openssh-7.7p1-gssapi-new-unique.patch
    - openssh-7.2p2-k5login_directory.patch
    - openssh-6.6p1-kuserok.patch
    - openssh-6.4p1-fromto-remote.patch
    - openssh-6.6.1p1-selinux-contexts.patch
    - openssh-6.6.1p1-log-in-chroot.patch
    - openssh-6.6.1p1-scp-non-existing-directory.patch
    - openssh-6.8p1-sshdT-output.patch
    - openssh-6.7p1-sftp-force-permission.patch
    - openssh-7.2p2-s390-closefrom.patch
    - openssh-7.3p1-x11-max-displays.patch
    - openssh-7.4p1-systemd.patch
    - openssh-7.6p1-cleanup-selinux.patch
    - openssh-7.5p1-sandbox.patch
    - openssh-8.0p1-pkcs11-uri.patch
    - openssh-7.8p1-scp-ipv6.patch
    - openssh-8.0p1-crypto-policies.patch
    - openssh-8.0p1-openssl-evp.patch
    - openssh-8.0p1-openssl-kdf.patch
    - openssh-8.2p1-visibility.patch
    - openssh-8.2p1-x11-without-ipv6.patch
    - openssh-8.0p1-keygen-strip-doseol.patch
    - openssh-8.0p1-preserve-pam-errors.patch
    - openssh-8.7p1-scp-kill-switch.patch
    - bugfix-sftp-when-parse_user_host_path-empty-path-should-be-allowed.patch
    - bugfix-openssh-6.6p1-log-usepam-no.patch
    - bugfix-openssh-add-option-check-username-splash.patch
    - feature-openssh-7.4-hima-sftpserver-oom-and-fix.patch
    - bugfix-openssh-fix-sftpserver.patch
    - set-sshd-config.patch
    - feature-add-SMx-support.patch
meta.description: |
    OpenSSH is the premier connectivity tool for remote login with the SSH protocol. \
    It encrypts all traffic to eliminate eavesdropping, connection hijacking, and \
    other attacks. In addition, OpenSSH provides a large suite of secure tunneling \
    capabilities, several authentication methods, and sophisticated configuration options.
requires:
    - /sbin/nologin
    - libselinux >= 2.3-5
    - audit-libs >= 1.0.8
    - openssh-server = %{version}-%{release}
buildRequires:
    - gtk2-devel
    - libX11-devel
    - openldap-devel
    - autoconf
    - automake
    - perl-interpreter
    - perl-generators
    - zlib-devel
    - audit-libs-devel >= 2.0.5
    - util-linux
    - groff
    - pam-devel
    - openssl-devel >= 0.9.8j
    - perl-podlators
    - systemd-devel
    - gcc
    - p11-kit-devel
    - krb5-devel
    - libedit-devel
    - ncurses-devel
    - libselinux-devel >= 2.3-5
    - audit-libs >= 1.0.8
    - xauth
    - gnupg2

recommends:
    - p11-kit
Pre:
    - openssh.sh
rpmMacros:
    - "%global gtk2 1"
    - "%global pie 1"
    - "%{?no_gtk2:%global gtk2 0}"
    - "%global sshd_uid    74"
    - "%global openssh_release 6"
    - "%{?systemd_requires}"

subpackage:
    clients:
      meta.summary: An open source SSH client applications
      meta.description: |
          OpenSSH is a free version of SSH (Secure SHell), a program for logging
          into and executing commands on a remote machine. This package includes
          the clients necessary to make encrypted connections to SSH servers.
      requires:
          - openssh = %{version}-%{release}
          - crypto-policies >= 20180306-1

    server:
      meta.summary: An open source SSH server daemon
      meta.description: |
          OpenSSH is a free version of SSH (Secure SHell), a program for logging
          into and executing commands on a remote machine. This package contains
          the secure shell daemon (sshd). The sshd daemon allows SSH clients to
          securely connect to your SSH server.
      requires:
          - openssh = %{version}-%{release}
          - pam >= 1.0.1-3
          - crypto-policies >= 20180306-1
      requiresPre:
          - shadow

      Pre:
          - openssh.sh
      Preun:
          - openssh.sh
      Post:
          - openssh.sh
      Postun:
          - openssh.sh

    keycat:
      meta.summary: A mls keycat backend for openssh
      meta.description: |
          OpenSSH mls keycat is backend for using the authorized keys in the
          openssh in the mls mode.
      requires:
          - openssh = %{version}-%{release}

    askpass:
      meta.summary: A passphrase dialog for OpenSSH and X
      meta.description: |
          OpenSSH is a free version of SSH (Secure SHell), a program for logging
          into and executing commands on a remote machine. This package contains
          an X11 passphrase dialog for OpenSSH.
      requires:
          - openssh = %{version}-%{release}

    pam_ssh_agent_auth:
      meta.summary: PAM module for authentication with ssh-agent
      version: 0.10.4
      release:
          - 4.%{openssh_release}
      meta.license: BSD
      meta.description:
      files: |
      AsWholeName: yes

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
env.configureFlags: |
    --with-default-path=/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin
    --with-superuser-path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
    --with-privsep-path=%{_var}/empty/sshd
    --disable-strip
    --without-zlib-version-check
    --with-ssl-engine
    --with-ipaddr-display
    --with-pie=no
    --without-hardening
    --with-systemd
    --with-default-pkcs11-provider=yes
    --with-pam
    --with-selinux
    --with-audit=linux
    --with-security-key-buildin=yes
