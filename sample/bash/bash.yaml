name: bash
meta.summary: It is the Bourne Again Shell
version: 5.1.8
release: 4
meta.license: GPLv3
meta.homepage: https://www.gnu.org/software/bash
sources:
    - https://ftp.gnu.org/gnu/%{name}/%{name}-%{version}.tar.gz
    - dot-bashrc
    - dot-bash_profile
    - dot-bash_logout
patchset:
    - bash-2.05a-interpreter.patch
    - bash-2.05b-pgrp_sync.patch
    - bash-4.0-nobits.patch
    - bash-4.2-coverity.patch
    - bash-4.3-noecho.patch
    - bash-4.3-memleak-lc_all.patch
    - bugfix-Forbidden-non-root-user-to-clear-history.patch
    - enable-dot-logout-and-source-bashrc-through-ssh.patch
    - cd-alias.patch
    - bash-5.1-sw.patch
meta.description: |
    Bash is the GNU Project's shell. Bash is the Bourne Again SHell. Bash is an sh-compatible
    shell that incorporates useful features from the Korn shell (ksh) and C shell (csh). It is
    intended to conform to the IEEE POSIX P1003.2/ISO 9945.2 Shell and Tools standard. It offers
    functional improvements over sh for both programming and interactive use. In addition, most
    sh scripts can be run by Bash without modification.
requires:
    - filesystem
buildRequires:
    - gcc bison texinfo autoconf ncurses-devel
    - glibc-all-langpacks
provides:
    - /bin/sh /bin/bash
    
filesInput: %{name}.lang

subpackage:
    devel:
      meta.summary: Development headers for %{name}
      meta.description: This package contains development files for %{name}.
      requires:
          - pkgconf-pkg-config
          

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      provides:
          - %{name}-doc = %{version}-%{release}
      obsoletes:
          - %{name}-doc < %{version}-%{release}
      buildArch: noarch
          
env.configureFlags: |
    --with-bash-malloc=no
    --with-afs