name: iptables
meta.summary: IP packet filter administration utilities
version: 1.8.7
release: 9
meta.license: GPLv2 and Artistic Licence 2.0 and ISC
meta.homepage: https://www.netfilter.org/
sources:
    - https://www.netfilter.org/projects/iptables/files/iptables-%{version}.tar.bz2
    - iptables.init
    - iptables-config
    - iptables.service
    - sysconfig_iptables
    - sysconfig_ip6tables
meta.description: |
    Netfilter is a set of hooks inside the Linux kernel that allows kernel
    modules to register callback functions with the network stack. A
    registered callback function is then called back for every packet that
    traverses the respective hook within the network stack.
    
    Iptables is a generic table structure for the definition of rulesets.
    Each rule within an IP table consists of a number of classifiers
    (iptables matches) and one connected action (iptables target).
    
    Netfilter, ip_tables, connection tracking (ip_conntrack, nf_conntrack)
    and the NAT subsystem together build the major parts of the framework.
requires:
    - %{name}-libs = %{version}-%{release}
requiresPost:
    - %{_sbindir}/update-alternatives
requiresPostUn:
    - %{_sbindir}/update-alternatives
buildRequires:
    - bison flex gcc kernel-headers libpcap-devel libselinux-devel systemd
    - libmnl-devel libnetfilter_conntrack-devel libnfnetlink-devel libnftnl-devel
    - autogen autoconf automake libtool
provides:
    - iptables-utils iptables-services
obsoletes:
    - iptables-utils iptables-services
conflicts:
    - setup < 2.10.4-1
    
Preun:
    - iptables.sh
Post:
    - iptables.sh
Postun:
    - iptables.sh
rpmMacros:
    - "%global script_path %{_libexecdir}/iptables"
    - "%global legacy_actions %{_libexecdir}/initscripts/legacy-actions"
    - "%{?systemd_requires}"

subpackage:
    libs:
      meta.summary: iptables libraries
      meta.description: iptables libraries.
          

    devel:
      meta.summary: header files for iproute
      meta.description: Header files for iproute.
      requires:
          - %{name} = %{version}-%{release} pkgconfig
          

    nft:
      meta.summary: nft package for iproute
      meta.description: Nft package for iproute.
      obsoletes:
          - iptables-compat < 1.6.2-4
          
      Post:
          - iptables.sh
      Postun:
          - iptables.sh

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
          
env.configureFlags: |
    --enable-devel
    --enable-bpf-compiler
    --with-kernel=/usr
    --with-kbuild=/usr
    --with-ksource=/usr