name: yajl
meta.summary: Yet Another JSON Library
version: 2.1.0
release: 19
meta.license: ISC
meta.homepage: https://github.com/lloyd/yajl
sources:
    - https://github.com/lloyd/yajl/archive/%{version}.tar.gz
patchset:
    - 0001-yajl-2.1.0-pkgconfig-location.patch
    - 0002-yajl-2.1.0-pkgconfig-includedir.patch
    - 0003-yajl-2.1.0-test-location.patch
    - 0004-yajl-2.1.0-dynlink-binaries.patch
    - 0005-yajl-2.1.0-fix-memory-leak.patch
    - 0006-fix-memory-leak-of-ctx-root.patch
    - 0007-add-cmake-option-for-test-and-binary.patch
    - backport-CVE-2022-24795.patch
    - yajl-assert-error-when-memory-allocation-failed.patch
meta.description: |
    yajl is a small event-driven JSON parser written in ANSI C, and a small
    validating JSON generator.
buildRequires:
    - cmake
    - gcc
    
subpackage:
    devel:
      meta.summary: Development files for %{name}
      meta.description: |
          This package provides the libraries and includes
          necessary for developing against the yajl library.

env.configureFlags: |
