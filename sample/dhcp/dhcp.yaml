name: dhcp
meta.summary: Dynamic host configuration protocol software
version: 4.4.2
release: 15
epoch: 12
meta.license: ISC
meta.homepage: https://www.isc.org/dhcp/
sources:
    - http://ftp.isc.org/isc/dhcp/%{version}/dhcp-%{version}.tar.gz
    - dhclient-script
    - README.dhclient.d
    - 11-dhclient
    - 56dhclient
    - dhcpd.service
    - dhcpd6.service
    - dhcrelay.service
patchset:
    - backport-0001-change-bug-url.patch
    - backport-0002-additional-dhclient-options.patch
    - backport-0003-Handle-releasing-interfaces-requested-by-sbin-ifup.patch
    - backport-0004-Support-unicast-BOOTP-for-IBM-pSeries-systems-and-ma.patch
    - backport-0005-Change-default-requested-options.patch
    - backport-0006-Various-man-page-only-fixes.patch
    - backport-0007-Change-paths-to-conform-to-our-standards.patch
    - backport-0008-Make-sure-all-open-file-descriptors-are-closed-on-ex.patch
    - backport-0009-Fix-garbage-in-format-string-error.patch
    - backport-0010-Handle-null-timeout.patch
    - backport-0011-Drop-unnecessary-capabilities.patch
    - backport-0012-RFC-3442-Classless-Static-Route-Option-for-DHCPv4-51.patch
    - backport-0013-DHCPv6-over-PPP-support-626514.patch
    - backport-0014-IPoIB-support-660681.patch
    - backport-0015-Add-GUID-DUID-to-dhcpd-logs-1064416.patch
    - backport-0016-Turn-on-creating-sending-of-DUID.patch
    - backport-0017-Send-unicast-request-release-via-correct-interface.patch
    - backport-0018-No-subnet-declaration-for-iface-should-be-info-not-e.patch
    - backport-0019-dhclient-write-DUID_LLT-even-in-stateless-mode-11563.patch
    - backport-0020-Discover-all-hwaddress-for-xid-uniqueness.patch
    - backport-0021-Load-leases-DB-in-non-replay-mode-only.patch
    - backport-0022-dhclient-make-sure-link-local-address-is-ready-in-st.patch
    - backport-0023-option-97-pxe-client-id.patch
    - backport-0024-Detect-system-time-changes.patch
    - backport-0025-bind-Detect-system-time-changes.patch
    - backport-0026-Add-dhclient-5-B-option-description.patch
    - backport-0027-Add-missed-sd-notify-patch-to-manage-dhcpd-with-syst.patch
    - bugfix-dhcp-4.2.5-check-dhclient-pid.patch
    - bugfix-reduce-getifaddr-calls.patch
    - bugfix-dhcpd-2038-problem.patch
    - dhcpd-coredump-infiniband.patch
    - bugfix-dhclient-check-if-pid-was-held.patch
    - bugfix-dhcp-64-bit-lease-parse.patch
    - backport-CVE-2021-25217.patch
    - fix-multiple-definition-with-gcc-10-1.patch
    - fix-multiple-definition-with-gcc-10-2.patch
    - fix-coredump-when-client-active-is-NULL.patch
    - feature-lease-time-config-ipv6.patch
    - add-a-test-case-to-parse-code93-in-option_unittest.patch
    - bugfix-error-message-display.patch
    - backport-Fix-CVE-2021-25214.patch
    - backport-Fix-CVE-2021-25215.patch
    - backport-Fix-CVE-2021-25219.patch
    - backport-Fix-CVE-2021-25220.patch
    - backport-Fix-CVE-2022-2928.patch
    - backport-Fix-CVE-2022-2929.patch
meta.description: The Dynamic Host Configuration Protocol (DHCP) is a network management protocol used on UDP/IP networks whereby a DHCP server dynamically assigns an IP address and other network configuration parameters to each device on a network so they can communicate with other IP networks.
requires:
    - shadow-utils coreutils grep sed systemd gawk ipcalc iproute iputils
buildRequires:
    - gcc autoconf automake libtool openldap-devel krb5-devel libcap-ng-devel
    - systemd systemd-devel
provides:
    - %{name}-common %{name}-libs %{name}-server %{name}-relay %{name}-compat %{name}-client
    - dhcp = %{epoch}:%{version}-%{release}
    - dhclient = %{epoch}:%{version}-%{release}
obsoletes:
    - %{name}-common %{name}-libs %{name}-server %{name}-relay %{name}-compat %{name}-client
    - dhcp < %{epoch}:%{version}-%{release}
    - dhclient < %{epoch}:%{version}-%{release}
    
Pre:
    - dhcp.sh
Preun:
    - dhcp.sh
Post:
    - dhcp.sh
Postun:
    - dhcp.sh
rpmMacros:
    - "%global nmconfdir %{_sysconfdir}/NetworkManager"
    - "%global dhcpconfdir %{_sysconfdir}/dhcp"

subpackage:
    devel:
      meta.summary: Development headers and libraries for interfacing to the DHCP server
      meta.description: |
          Header files for using the ISC DHCP libraries.  The
          libdhcpctl and libomapi static libraries are also included in this package.
          
          

    help:
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
          
env.configureFlags: |
    --with-srv-lease-file=%{_localstatedir}/lib/dhcpd/dhcpd.leases
    --with-srv6-lease-file=%{_localstatedir}/lib/dhcpd/dhcpd6.leases
    --with-cli-lease-file=%{_localstatedir}/lib/dhclient/dhclient.leases
    --with-cli6-lease-file=%{_localstatedir}/lib/dhclient/dhclient6.leases
    --with-srv-pid-file=%{_localstatedir}/run/dhcpd.pid
    --with-srv6-pid-file=%{_localstatedir}/run/dhcpd6.pid
    --with-cli-pid-file=%{_localstatedir}/run/dhclient.pid
    --with-cli6-pid-file=%{_localstatedir}/run/dhclient6.pid
    --with-relay-pid-file=%{_localstatedir}/run/dhcrelay.pid
    --with-ldap
    --with-ldapcrypto
    --with-ldap-gssapi
    --disable-static
    --enable-log-pid
    --enable-paranoia
    --enable-early-chroot
    --enable-binary-leases
    --with-systemd