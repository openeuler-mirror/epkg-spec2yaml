name: rsyslog
meta.summary: The rocket-fast system for log processing
version: 8.2110.0
release: 11
meta.license: (GPLv3+ and ASL 2.0)
meta.homepage: http://www.rsyslog.com/
sources:
    - http://www.rsyslog.com/files/download/rsyslog/%{name}-%{version}.tar.gz
    - http://www.rsyslog.com/files/download/rsyslog/%{name}-doc-%{version}.tar.gz
    - rsyslog.conf
    - rsyslog.sysconfig
    - rsyslog.log
    - os_rotate_and_save_log.sh
    - os_check_timezone_for_rsyslog.sh
    - timezone.cron
    - rsyslog.service
    - timezone_update.sh
patchset:
    - rsyslog-8.24.0-ensure-parent-dir-exists-when-writting-log-file.patch
    - bugfix-rsyslog-7.4.7-imjournal-add-monotonic-timestamp.patch
    - bugfix-rsyslog-7.4.7-add-configuration-to-avoid-memory-leak.patch
    - rsyslog-8.37.0-initialize-variables-and-check-return-value.patch
    - print-main-queue-info-to-journal-when-queue-full.patch %if %{systemd_lived} == 1
    - print-main-queue-info-to-journal-when-receive-USR1-signal.patch %if %{systemd_lived} == 1
    - bugfix-CVE-2022-24903.patch
    - backport-testbench-skip-omfwd_fast_imuxsock.sh-if-liblogging-stdlog-is-not-available.patch
    - backport-Fixes-4395-by-correctly-checking-for-EPIPE.patch
    - backport-rsyslogd-adjust-the-order-of-doHUP-and-processImInte.patch
    - backport-gnutls-bugfix-Fix-error-handling-in-gtlsRecordRecv.patch
    - backport-Fix-non-null-terminated-string-used-with-strlen.patch
    - backport-tcpsrv-do-not-decrease-number-of-to-be-processed-fds.patch
    - backport-imptcp-bugfix-worker-thread-starvation-on-extreme-tr.patch
    - backport-Fix-memory-leak-when-globally-de-initialize-GnuTLS.patch
    - backport-Fix-memory-leak-when-free-action-worker-data-table.patch
meta.description: |
    RSYSLOG is the rocket-fast system for log processing.It offers high-performance,
    great security features and a modular design. While it started as a regular syslogd,
    rsyslog has evolved into a kind of swiss army knife of logging, being able to
    accept inputs from a wide variety of sources, transform them, and output to the
    results to diverse destinations.
    
    RSYSLOG can deliver over one million messages per second to local destinations when
    limited processing is applied. Even with remote destinations and more elaborate
    processing the performance is usually considered “stunning”.
requires:
    - logrotate >= 3.5.2 bash >= 2.0
buildRequires:
    - gcc autoconf automake bison dos2unix flex pkgconfig python3-docutils libtool
    - libgcrypt-devel libuuid-devel zlib-devel krb5-devel libnet-devel gnutls-devel
    - libfastjson-devel >= 0.99.8 libestr-devel >= 0.1.9
    - mariadb-connector-c-devel net-snmp-devel qpid-proton-c-devel libcurl-devel
    - systemd-devel >= 204-8 %if %{systemd_lived} == 1
provides:
    - syslog
obsoletes:
    - sysklogd < 1.5-11
files: |
    %defattr(-,root,root,-)
    %doc ChangeLog README.md
    %license AUTHORS
    %doc %{rsyslog_docdir}/pgsql-createDB.sql
    %license COPYING*
    %{rsyslog_docdir}
    %dir %{_libdir}/rsyslog
    %dir %{_sysconfdir}/rsyslog.d
    %dir %{rsyslog_statedir}
    %dir %{rsyslog_pkidir}
    %{_sbindir}/rsyslogd
    %attr(500,root,root) %{_bindir}/os_rotate_and_save_log.sh
    %attr(500,root,root) %{_bindir}/os_check_timezone_for_rsyslog.sh
    %attr(500,root,root) %{_bindir}/timezone_update.sh
    /etc/cron.d/timezone.cron
    %{_unitdir}/rsyslog.service
    %config(noreplace) %{_sysconfdir}/rsyslog.conf
    %config(noreplace) %{_sysconfdir}/sysconfig/rsyslog
    %config(noreplace) %{_sysconfdir}/logrotate.d/rsyslog
    %{_libdir}/rsyslog/fmhttp.so
    %{_libdir}/rsyslog/fmhash.so
    %{_libdir}/rsyslog/imfile.so
    %if %{systemd_lived} == 1
    %{_libdir}/rsyslog/omjournal.so
    %{_libdir}/rsyslog/imjournal.so
    %endif
    %{_libdir}/rsyslog/imklog.so
    %{_libdir}/rsyslog/immark.so
    %{_libdir}/rsyslog/impstats.so
    %{_libdir}/rsyslog/imptcp.so
    %{_libdir}/rsyslog/imtcp.so
    %{_libdir}/rsyslog/imudp.so
    %{_libdir}/rsyslog/imuxsock.so
    %{_libdir}/rsyslog/lmnet.so
    %{_libdir}/rsyslog/lmnetstrms.so
    %{_libdir}/rsyslog/lmnsd_ptcp.so
    %{_libdir}/rsyslog/lmregexp.so
    %{_libdir}/rsyslog/lmtcpclt.so
    %{_libdir}/rsyslog/lmtcpsrv.so
    %{_libdir}/rsyslog/lmzlibw.so
    %{_libdir}/rsyslog/mmanon.so
    %{_libdir}/rsyslog/mmcount.so
    %{_libdir}/rsyslog/mmexternal.so
    %{_libdir}/rsyslog/ommail.so
    %{_libdir}/rsyslog/omprog.so
    %{_libdir}/rsyslog/omstdout.so
    %{_libdir}/rsyslog/omtesting.so
    %{_libdir}/rsyslog/omuxsock.so
    %{_libdir}/rsyslog/pmaixforwardedfrom.so
    %{_libdir}/rsyslog/pmcisconames.so
    %{_libdir}/rsyslog/pmlastmsg.so
    %{_libdir}/rsyslog/pmsnare.so
    %exclude %{rsyslog_docdir}/html
    %exclude %{rsyslog_docdir}/mysql-createDB.sql
    %exclude %{rsyslog_docdir}/pgsql-createDB.sql
    
Pre:
    - rsyslog.sh
    - '%if %{systemd_lived} == 1'
Preun:
    - rsyslog.sh
    - '%if %{systemd_lived} == 1
%if %{systemd_lived} == 1'
Post:
    - rsyslog.sh
    - '%if %{systemd_lived} == 1'
Postun:
    - rsyslog.sh
    - '%if %{systemd_lived} == 1
%if %{systemd_lived} == 1'
rpmMacros:
    - "%define rsyslog_statedir %{_sharedstatedir}/rsyslog"
    - "%define rsyslog_pkidir %{_sysconfdir}/pki/rsyslog"
    - "%define rsyslog_docdir %{_docdir}/rsyslog"
    - "%define systemd_lived 1"
    - "%{?systemd_requires}"

subpackage:
    - name: hiredis
      meta.summary: Redis support for rsyslog
      group: System Environment/Daemons
      meta.description: This package provides support from redis.
      requires:
          - %name = %version-%release
      buildRequires:
          - hiredis-devel
      files: |
          %{_libdir}/rsyslog/omhiredis.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: kafka
      meta.summary: Provides the omkafka module
      group: System Environment/Daemons
      meta.description: This package provides support from kafka.
      requires:
          - %name = %version-%release
      buildRequires:
          - librdkafka-devel
      files: |
          %{_libdir}/rsyslog/omkafka.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mmnormalize
      meta.summary: Log normalization support for rsyslog
      group: System Environment/Daemons
      meta.description: This module provides the capability to normalize log messages via liblognorm.
      requires:
          - %name = %version-%release
      buildRequires:
          - libestr-devel liblognorm-devel >= 1.0.2
      files: |
          %{_libdir}/rsyslog/mmnormalize.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mmkubernetes
      meta.summary: Provides the mmkubernetes module
      group: System Environment/Daemons
      meta.description: This package provides support for kubernetes to add container metadata.
      requires:
          - %name = %version-%release
      buildRequires:
          - libcurl-devel
      files: |
          %{_libdir}/rsyslog/mmkubernetes.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mongodb
      meta.summary: MongoDB support for rsyslog
      group: System Environment/Daemons
      meta.description: This package provides support from mongodb.
      requires:
          - %name = %version-%release
      buildRequires:
          - mongo-c-driver-devel snappy-devel cyrus-sasl-devel
      files: |
          %{_bindir}/logctl
          %{_libdir}/rsyslog/ommongodb.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: omamqp1
      meta.summary: Provides the omamqp1 module
      group: System Environment/Daemons
      meta.description: |
          The omamqp1 output module can be used to send log messages via an AMQP
          1.0-compatible messaging bus.
      requires:
          - %name = %version-%release
      buildRequires:
          - qpid-proton-c-devel
      files: |
          %{_libdir}/rsyslog/omamqp1.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: pgsql
      meta.summary: PostgresSQL support for rsyslog
      group: System Environment/Daemons
      meta.description: |
          The rsyslog-pgsql package contains a dynamic shared object that will add
          PostgreSQL database support to rsyslog.
      requires:
          - %name = %version-%release
      buildRequires:
          - postgresql-devel
      files: |
          %doc %{rsyslog_docdir}/pgsql-createDB.sql
          %{_libdir}/rsyslog/ompgsql.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: rabbitmq
      meta.summary: RabbitMQ support for rsyslog
      group: System Environment/Daemons
      meta.description: This package provides support from rabbitmq.
      requires:
          - %name = %version-%release
      buildRequires:
          - librabbitmq-devel >= 0.2
      files: |
          %{_libdir}/rsyslog/omrabbitmq.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: relp
      meta.summary: RELP protocol support for rsyslog
      group: System Environment/Daemons
      meta.description: |
          The rsyslog-relp package contains the rsyslog plugins that provide
          the ability to receive syslog messages via the reliable RELP
          protocol.
      requires:
          - %name = %version-%release
      buildRequires:
          - librelp-devel >= 1.0.3
      files: |
          %{_libdir}/rsyslog/imrelp.so
          %{_libdir}/rsyslog/omrelp.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: snmp
      meta.summary: SNMP protocol support for rsyslog
      group: System Environment/Daemons
      meta.description: |
          The rsyslog-snmp package contains the rsyslog plugin that provides the
          ability to send syslog messages as SNMPv1 and SNMPv2c traps.
      requires:
          - %name = %version-%release
      buildRequires:
          - net-snmp-devel
      files: |
          %{_libdir}/rsyslog/omsnmp.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: crypto
      meta.summary: Encryption support
      meta.description: |
          This package contains a module providing log file encryption and a
          command line tool to process encrypted logs.
      requires:
          - %name = %version-%release
      files: |
          %{_bindir}/rscryutil
          %{_libdir}/rsyslog/lmcry_gcry.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: doc
      meta.summary: HTML documentation for rsyslog
      meta.description: This subpackage contains documentation for rsyslog.
      buildArch: noarch
      files: |
          %doc %{rsyslog_docdir}/html
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: elasticsearch
      meta.summary: ElasticSearch output module for rsyslog
      meta.description: |
          This module provides the capability for rsyslog to feed logs directly into
          Elasticsearch.
      requires:
          - %name = %version-%release
      buildRequires:
          - libcurl-devel
      files: |
          %{_libdir}/rsyslog/omelasticsearch.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mmjsonparse
      meta.summary: JSON enhanced logging support
      meta.description: |
          This module provides the capability to recognize and parse JSON enhanced
          syslog messages.
      requires:
          - %name = %version-%release
      files: |
          %{_libdir}/rsyslog/mmjsonparse.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mysql
      meta.summary: MySQL support for rsyslog
      meta.description: |
          The rsyslog-mysql package contains a dynamic shared object that will add
          MySQL database support to rsyslog.
      requires:
          - %name = %version-%release
      buildRequires:
          - mariadb-connector-c-devel
      files: |
          %doc %{rsyslog_docdir}/mysql-createDB.sql
          %{_libdir}/rsyslog/ommysql.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mmsnmptrapd
      meta.summary: Message modification module for snmptrapd generated messages
      meta.description: |
          This message modification module takes messages generated from snmptrapd and
          modifies them so that they look like they originated from the read originator.
      requires:
          - %name = %version-%release
      files: |
          %{_libdir}/rsyslog/mmsnmptrapd.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: mmaudit
      meta.summary: Message modification module supporting Linux audit format
      meta.description: |
          This module provides message modification supporting Linux audit format
          in various settings.
      requires:
          - %name = %version-%release
      files: |
          %{_libdir}/rsyslog/mmaudit.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: gssapi
      meta.summary: GSSAPI authentication and encryption support for rsyslog
      meta.description: |
          The rsyslog-gssapi package contains the rsyslog plugins which support GSSAPI
          authentication and secure connections. GSSAPI is commonly used for Kerberos
          authentication.
      requires:
          - %name = %version-%release
      buildRequires:
          - krb5-devel
      files: |
          %{_libdir}/rsyslog/lmgssutil.so
          %{_libdir}/rsyslog/imgssapi.so
          %{_libdir}/rsyslog/omgssapi.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: gnutls
      meta.summary: TLS protocol support for rsyslog via GnuTLS library
      meta.description: |
          The rsyslog-gnutls package contains the rsyslog plugins that provide the
          ability to send and receive syslog messages via TCP or RELP using TLS
          encryption via GnuTLS library. For details refer to rsyslog doc on imtcp
          and omfwd modules.
      requires:
          - %name = %version-%release
      buildRequires:
          - gnutls-devel
      files: |
          %{_libdir}/rsyslog/lmnsd_gtls.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: udpspoof
      meta.summary: Provides the omudpspoof module
      meta.description: |
          This module is similar to the regular UDP forwarder, but permits to
          spoof the sender address. Also, it enables to circle through a number
          of source ports.
      requires:
          - %name = %version-%release
      buildRequires:
          - libnet-devel
      files: |
          %{_libdir}/rsyslog/omudpspoof.so
          
      filesJudgement:
          - %if %{systemd_lived} == 1

    - name: help
      meta.summary: Documents for %{name}
      meta.description: Man pages and other related documents for %{name}.
      requires:
          - man info
      buildArch: noarch
      files: |
          %doc %{rsyslog_docdir}/html
          %{_mandir}/man5/rsyslog.conf.5.gz
          %{_mandir}/man8/rsyslogd.8.gz
          %{_mandir}/man1/rscryutil.1.gz
          
      filesJudgement:
          - %if %{systemd_lived} == 1

