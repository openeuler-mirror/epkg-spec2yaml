files: |
    %license COPYING
    %doc Changelog
    %{_bindir}/*
    %{_sbindir}/*
    %{_unitdir}/*.service
    %config(noreplace) %{_sysconfdir}/*
    %exclude %{_docdir}/%{name}

subpackage.devel.files: |
    %doc doc/* ldap-scripts
    %dir %{_includedir}/rpcsvc
    %{_includedir}/rpcsvc/*

subpackage.help.files: |
    %{_mandir}/man*/*
